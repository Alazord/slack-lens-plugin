<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slack Triage — Live</title>
<style>
/* ========================================================================
   Design tokens — applied via :root (light default) + data-theme="dark"
   Densities via data-density="compact|balanced|spacious" (default balanced)
   See docs/superpowers/specs/2026-04-22-slacklens-dashboard-redesign-design.md
   ======================================================================== */
:root {
  /* Typography families */
  --font-serif: "Iowan Old Style", "Palatino", "Hoefler Text", Georgia, serif;
  --font-sans:  -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-mono:  "SF Mono", "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Font sizes — Balanced defaults; overridden per density below */
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-base: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;

  /* Spacing tokens — Balanced defaults; overridden per density below */
  --item-py: 6px;
  --item-gap: 4px;
  --channel-mb: 16px;
  --col-gap: 20px;
  --frame-pad: 24px;
  --chanhead-py: 6px;

  /* Colors — light theme (default) */
  --surface: #faf9f4;
  --surface-2: #fefdf8;
  --border: #e8e5d9;
  --border-faint: #eeeadd;
  --ink: #2a2822;
  --ink-muted: #5a5648;
  --ink-faint: #908b78;
  --vip-red: #b64535;
  --status-red: #b64535;
  --status-amber: #b8821f;
  --status-gray: #d6d0bd;
  --status-green: #5a7f5a;

  /* Misc */
  --stale-cache-hours: 12;  /* freshness meta turns amber past this */
  --transition-theme: 150ms ease;
}

:root[data-density="compact"] {
  --fs-xs: 10px;  --fs-sm: 11px;  --fs-base: 12px;  --fs-md: 13px;  --fs-lg: 15px;
  --item-py: 4px;  --item-gap: 2px;  --channel-mb: 12px;
  --col-gap: 16px;  --frame-pad: 20px;  --chanhead-py: 4px;
}
:root[data-density="spacious"] {
  --fs-xs: 12px;  --fs-sm: 13px;  --fs-base: 14px;  --fs-md: 15px;  --fs-lg: 17px;
  --item-py: 10px;  --item-gap: 6px;  --channel-mb: 24px;
  --col-gap: 24px;  --frame-pad: 32px;  --chanhead-py: 8px;
}

:root[data-theme="dark"] {
  --surface: #1a1814;
  --surface-2: #22201b;
  --border: #2e2b24;
  --border-faint: #262420;
  --ink: #ede8d6;
  --ink-muted: #b0a991;
  --ink-faint: #8a8270;
  --vip-red: #e87b68;
  --status-red: #e87b68;
  --status-amber: #d4a33a;
  --status-gray: #4a4539;
  --status-green: #7ea97e;
}

/* Follow OS default when no explicit theme is set */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --surface: #1a1814; --surface-2: #22201b; --border: #2e2b24; --border-faint: #262420;
    --ink: #ede8d6; --ink-muted: #b0a991; --ink-faint: #8a8270;
    --vip-red: #e87b68; --status-red: #e87b68; --status-amber: #d4a33a;
    --status-gray: #4a4539; --status-green: #7ea97e;
  }
}

/* ========================================================================
   Global + layout
   ======================================================================== */
html { background: var(--surface); color: var(--ink); transition: background-color var(--transition-theme), color var(--transition-theme); }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.4;
  margin: 0;
  padding: var(--frame-pad);
  max-width: 1800px;
  margin-inline: auto;
  color: var(--ink);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }

.sl-flow {
  margin-top: 20px;
}
@media (min-width: 1024px) {
  .sl-flow {
    columns: 2;
    column-gap: var(--col-gap);
  }
  .sl-channel { break-inside: avoid; display: block; }
}

.sl-footer {
  margin-top: 32px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  text-align: right;
}
.sl-footer code { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
  <!-- Topbar: wordmark · freshness · theme toggle · reload -->
  <header class="sl-topbar">
    <div class="sl-brand">SlackLens</div>
    <div class="sl-topbar-right">
      <div id="freshness" class="sl-fresh">0 · loading…</div>
      <button id="themeToggle" class="sl-iconbtn" type="button" aria-label="Toggle theme">☾</button>
      <button id="reloadBtn" class="sl-reload" type="button">↻ Reload</button>
    </div>
  </header>

  <!-- Toolbar: category filters · status filters · search · density · snoozed -->
  <nav class="sl-toolbar" aria-label="Filters and controls">
    <div class="sl-pills" id="categoryPills" role="radiogroup" aria-label="Category filter">
      <button class="sl-pill active" data-scope="all"         type="button">All <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="needs_reply" type="button">Needs reply <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="mentions"    type="button">Mentions <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="dms"         type="button">DMs <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="channels"    type="button">Channels <span class="count">0</span></button>
    </div>
    <div class="sl-divider"></div>
    <div class="sl-pills" id="statusPills" aria-label="Status filter">
      <button class="sl-pill" data-status="BACKLOG"     type="button">Backlog</button>
      <button class="sl-pill" data-status="IN PROGRESS" type="button">In progress</button>
      <button class="sl-pill" data-status="WAITING"     type="button">Waiting</button>
      <button class="sl-pill" data-status="DONE"        type="button">Done</button>
    </div>
    <div class="sl-divider"></div>
    <label class="sl-search">
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="text" placeholder="Search channel, person, text…" />
    </label>
    <div class="sl-density" role="radiogroup" aria-label="Density">
      <button class="sl-density-btn" data-density="compact"  type="button">Compact</button>
      <button class="sl-density-btn active" data-density="balanced" type="button">Balanced</button>
      <button class="sl-density-btn" data-density="spacious" type="button">Spacious</button>
    </div>
    <label class="sl-switch" id="showSnoozedLabel">
      <input id="showSnoozed" type="checkbox" />
      <span class="track"></span>
      <span class="label">Show snoozed</span>
    </label>
  </nav>

  <!-- Banner: stale cache / schema mismatch / fetch-failed -->
  <div id="banner" class="sl-banner" hidden></div>

  <!-- Channel flow: all channel groups render here, VIPs floated first -->
  <main id="channelFlow" class="sl-flow" aria-label="Channels"></main>

  <!-- Empty state container (shown when nothing renders) -->
  <div id="emptyState" class="sl-empty" hidden></div>

  <footer class="sl-footer">
    <span>Cowork live artifact · data: <code>~/.slacklens/cache.json</code></span>
  </footer>

  <!-- Side panel (BELOW all interactive content, ABOVE the script tag) -->
  <aside id="sidePanel" class="sl-panel" hidden aria-label="Thread detail">
    <div class="sl-panel-head">
      <div class="sl-panel-title">
        <span id="panelChannel"></span>
        <span id="panelVip" class="sl-vip" hidden>VIP</span>
      </div>
      <button id="panelClose" class="sl-iconbtn" type="button" aria-label="Close panel">✕</button>
    </div>
    <div class="sl-panel-meta">
      <div><span class="k">Channel</span><span id="panelChannelType"></span></div>
      <div><span class="k">Status</span><span id="panelStatus"></span></div>
    </div>
    <div class="sl-panel-actions">
      <button id="actStatus"  class="sl-btn" type="button">◐ Status ▾</button>
      <button id="actSnooze"  class="sl-btn" type="button">☾ Snooze ▾</button>
      <button id="actDone"    class="sl-btn" type="button">✓ Mark done</button>
      <button id="actOpen"    class="sl-btn primary" type="button">↗ Open in Slack</button>
      <button id="actCopy"    class="sl-btn" type="button">⎘ Copy permalink</button>
    </div>
    <div id="panelThread" class="sl-panel-thread"></div>
    <div class="sl-panel-note">
      <div class="sl-note-label">Note</div>
      <textarea id="panelNote" placeholder="Add a private note about this thread (saved locally)"></textarea>
    </div>
  </aside>
  <div id="panelBackdrop" class="sl-panel-backdrop" hidden></div>

<script>
// ---------- Inlined cache (works under file://) ----------
window.__SLACK_CACHE__ = {
  "refreshed_at": null,
  "search_results": { "mentions": [], "dms": [], "channels": [] },
  "threads": {}
};
// ---------- State ----------
const LS_KEY = 'slackTriageOverrides.v1';
const STATUSES = ['AWAITING YOUR REPLY','BACKLOG','IN PROGRESS','WAITING','DISCUSSION','DONE'];
const ME_ID = '';
const ME_NAME = '';
const VIP_IDS = [];  // VIPs (filled by slacklens-setup)
const VIP_NAMES = [];

let raw = null;       // parsed cache JSON
let items = [];       // normalized list
let filter = { scope:'all', status:null, query:'', showSnoozed:false };
let overrides = loadOverrides();
// Workspace origin (e.g. 'https://example.slack.com'), derived from the
// first permalink we see in the cache. Falls back to slack.com so the
// link-out still resolves to Slack's router for unknown workspaces.
let WORKSPACE_ORIGIN = 'https://slack.com';

function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
  catch { return {}; }
}
function saveOverrides() {
  localStorage.setItem(LS_KEY, JSON.stringify(overrides));
}
function overrideFor(key) {
  if (!overrides[key]) overrides[key] = {};
  return overrides[key];
}

// ---------- Loading ----------
async function loadCache() {
  setNotice('', null);
  // 1) Try a live fetch (works when served over http://)
  const url = './slack-triage-cache.json?t=' + Date.now();
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    raw = await r.json();
    normalize();
    render();
    setNotice('Loaded fresh cache from disk at ' + new Date().toLocaleTimeString() + '.', 'info');
    setTimeout(() => setNotice('', null), 3500);
    return;
  } catch (e) {
    // 2) Fall back to the cache embedded at file generation time.
    if (window.__SLACK_CACHE__) {
      raw = window.__SLACK_CACHE__;
      normalize();
      render();
      // embedded cache — no banner
      return;
    }
    setNotice('No cache data available (' + e.message + ').', 'err');
    document.getElementById('freshness').innerHTML = 'No cache loaded.';
  }
}

// Normalize mentions + threads into a single item list
function normalize() {
  items = [];
  const seen = new Set();
  deriveWorkspaceOrigin();

  // 1) Threads (richer — have message history)
  const threads = raw.threads || {};
  Object.entries(threads).forEach(([threadKey, t]) => {
    if (!t || !t.channel_id) return;
    const msgs = (t.messages || []).slice().sort((a,b) => (+a.ts||0) - (+b.ts||0));
    const last = msgs[msgs.length - 1];
    const firstNonMe = msgs.find(m => !isMe(m.from));
    const permalink = deriveThreadPermalink(t, last || firstNonMe);
    const key = permalink || (t.channel_id + '/' + (t.thread_ts || 'top'));
    if (seen.has(key)) return; seen.add(key);

    const lastFrom = last ? cleanName(last.from) : '';
    const lastIsMe = last ? isMe(last.from) : false;
    const lastText = last ? last.text : '';
    const lastTime = last ? last.time : '';

    const derived = inferStatus({
      channel_name: t.channel_name,
      lastIsMe, lastText, msgs
    });

    items.push({
      key,
      kind: kindFromChannel(t.channel_name, t.channel_id),
      channel_id: t.channel_id,
      channel_name: t.channel_name,
      channel_display: prettyChannel(t.channel_name, t.channel_id),
      permalink,
      last_from: lastFrom,
      last_is_me: lastIsMe,
      last_text: lastText,
      last_time: lastTime,
      msg_count: msgs.length,
      participants: Array.from(new Set(msgs.map(m => cleanName(m.from)))).filter(Boolean),
      my_last_text: (msgs.slice().reverse().find(m => isMe(m.from)) || {}).text || '',
      status: derived.status,
      needs_reply: derived.needs_reply,
      project: projectFromChannel(t.channel_name),
      source: 'thread',
    });
  });

  // 2) Mentions (messages addressed to you) — add as items if not already covered by a thread
  const mentionsQueries = (raw.search_results && raw.search_results.mentions) || [];
  mentionsQueries.forEach(q => (q.results || []).forEach(m => {
    if (!m.permalink) return;
    const threadURL = m.permalink.split('?')[0];
    // If we already have a thread whose key matches this channel, skip duplicating
    const existing = items.find(it => it.channel_id === m.channel_id);
    if (existing) {
      // attach mention text as hint if newer
      if (!existing.mention_preview) existing.mention_preview = m.text;
      return;
    }
    if (seen.has(m.permalink)) return; seen.add(m.permalink);
    items.push({
      key: m.permalink,
      kind: kindFromChannel(m.channel_name, m.channel_id),
      channel_id: m.channel_id,
      channel_name: m.channel_name,
      channel_display: prettyChannel(m.channel_name, m.channel_id),
      permalink: m.permalink,
      last_from: cleanName(m.from_user),
      last_is_me: isMe(m.from_user),
      last_text: m.text,
      last_time: m.time,
      msg_count: 1,
      participants: [cleanName(m.from_user)].filter(Boolean),
      my_last_text: '',
      status: 'AWAITING YOUR REPLY',
      needs_reply: !isMe(m.from_user),
      project: projectFromChannel(m.channel_name),
      source: 'mention',
    });
  }));

  items.forEach(it => {
    it.channel_key = it.channel_id;
    it.channel_is_vip = threadHasVIP(it);
  });

  items.sort((a, b) => (b.last_time || '').localeCompare(a.last_time || ''));
}

function isMe(s) {
  if (!s) return false;
  return (ME_ID && s.includes(ME_ID)) || (ME_NAME && s.includes(ME_NAME));
}
function isVIP(s) {
  if (!s) return false;
  return VIP_IDS.some(id => s.includes(id)) || VIP_NAMES.some(n => s.includes(n));
}
function threadHasVIP(it) {
  // Check last_from, participants, channel_display for any VIP
  if (isVIP(it.last_from)) return true;
  if (it.participants && it.participants.some(p => isVIP(p))) return true;
  if (isVIP(it.channel_display)) return true;
  return false;
}
function cleanName(s) {
  if (!s) return '';
  return s.replace(/\s*\([UC][0-9A-Z]+\)\s*$/,'').trim();
}
function kindFromChannel(name, id) {
  const n = (name||'').toLowerCase();
  if (n.startsWith('dm (') || (id||'').startsWith('D')) return 'dm';
  if (n.startsWith('group dm')) return 'dm';
  return 'channel';
}
function prettyChannel(name, id) {
  if (!name) return id || '?';
  if (name.toLowerCase().startsWith('dm (')) {
    // e.g. "DM (You, Other)" -> "@Other"
    const m = name.match(/\((.+)\)/);
    if (m) {
      const parts = m[1].split(',').map(s => s.trim()).filter(s => !isMe(s));
      return '@' + (parts[0] || 'DM');
    }
  }
  if (name.toLowerCase().startsWith('group dm')) {
    const m = name.match(/\((.+)\)/);
    if (m) {
      const parts = m[1].split(',').map(s => s.trim()).filter(s => !isMe(s));
      return 'Group · ' + parts.slice(0,2).join(', ') + (parts.length>2?'…':'');
    }
    return 'Group DM';
  }
  return '#' + name.replace(/^#/,'');
}
function projectFromChannel(name) {
  if (!name) return 'Other';
  const n = name.toLowerCase();
  if (n.startsWith('dm ') || n.startsWith('group dm')) return 'DM';
  return 'Other';
}
function deriveThreadPermalink(t, msg) {
  if (msg && msg.permalink) return msg.permalink;
  const ts = (t.thread_ts && t.thread_ts !== 'top_level') ? t.thread_ts : (msg ? msg.ts : '');
  if (!ts) return `${WORKSPACE_ORIGIN}/archives/${t.channel_id}`;
  return `${WORKSPACE_ORIGIN}/archives/${t.channel_id}/p${ts.replace('.','')}`;
}
// Scan the cache for the first permalink and extract its origin
// (e.g. 'https://acme.slack.com') so fallback links stay on the right
// workspace without hardcoding it.
function deriveWorkspaceOrigin() {
  const sr = (raw && raw.search_results) || {};
  const buckets = [sr.mentions, sr.dms, sr.channels, Object.values(raw && raw.threads || {})];
  for (const bucket of buckets) {
    if (!bucket) continue;
    for (const entry of bucket) {
      const results = entry && (entry.results || entry.messages);
      if (!results) continue;
      for (const r of results) {
        if (r && typeof r.permalink === 'string' && r.permalink.startsWith('http')) {
          try { WORKSPACE_ORIGIN = new URL(r.permalink).origin; return; }
          catch (_) { /* ignore malformed */ }
        }
      }
    }
  }
}
function inferStatus({channel_name, lastIsMe, lastText, msgs}) {
  // Heuristics — user's overrides (if any) win at render time.
  const text = (lastText || '').toLowerCase();
  if (/resolved|fixed|merged|done|thanks, done/.test(text)) return {status:'DONE', needs_reply:false};
  if (lastIsMe) {
    // I spoke last — waiting on someone else
    return {status:'WAITING', needs_reply:false};
  }
  // Someone else spoke last — I likely owe a reply
  if (/eta|breach|urgent|please|need to|blocker/.test(text)) return {status:'BACKLOG', needs_reply:true};
  if (/check|verify|review|confirm|pr\s*#?\d/.test(text)) return {status:'AWAITING YOUR REPLY', needs_reply:true};
  return {status:'AWAITING YOUR REPLY', needs_reply:true};
}

// ---------- Rendering ----------

// Group items by channel_id. Returns an array of channel objects ordered:
//   1. VIP channels (any item is_vip) — latest-activity first among VIPs
//   2. Non-VIP channels — latest-activity first
// Each channel: { key, name, display, is_vip, last_time, items: [...] }
function partitionByChannel(flatItems) {
  const byKey = new Map();
  for (const it of flatItems) {
    if (!byKey.has(it.channel_key)) {
      byKey.set(it.channel_key, {
        key: it.channel_key,
        name: it.channel_name || it.channel_id,
        display: it.channel_display || it.channel_name || it.channel_id,
        is_vip: false,
        last_time: '',
        items: [],
      });
    }
    const ch = byKey.get(it.channel_key);
    ch.items.push(it);
    if (it.channel_is_vip) ch.is_vip = true;
    if ((it.last_time || '') > ch.last_time) ch.last_time = it.last_time;
  }
  const all = Array.from(byKey.values());
  // items already sorted newest-first in normalize(); preserve that inside each channel.
  const vip   = all.filter(c =>  c.is_vip).sort((a, b) => b.last_time.localeCompare(a.last_time));
  const other = all.filter(c => !c.is_vip).sort((a, b) => b.last_time.localeCompare(a.last_time));
  return vip.concat(other);
}

function render() {
  const flow = document.getElementById('channelFlow');
  const empty = document.getElementById('emptyState');
  if (!flow) return;
  flow.innerHTML = '';

  const shown = applyFilter(items);
  const channels = partitionByChannel(shown);

  if (channels.length === 0) {
    empty.hidden = false;
    empty.innerHTML = '<h4>Nothing in the last 48 hours</h4><p>Catch your breath.</p>';
    return;
  }
  empty.hidden = true;

  for (const ch of channels) {
    flow.appendChild(renderChannel(ch));
  }

  updateCounts(shown);
  updateFreshness();
}

function renderChannel(ch) {
  const wrap = document.createElement('section');
  wrap.className = 'sl-channel';
  wrap.dataset.vip = ch.is_vip ? '1' : '0';

  const head = document.createElement('header');
  head.className = 'sl-channel-head';
  const name = document.createElement('div');
  name.className = 'sl-channel-name';
  name.textContent = ch.display;
  if (ch.is_vip) {
    const vip = document.createElement('span');
    vip.className = 'sl-vip';
    vip.textContent = 'VIP';
    name.appendChild(vip);
  }
  head.appendChild(name);

  const meta = document.createElement('div');
  meta.className = 'sl-channel-meta';
  const shortTime = (ch.last_time || '').slice(11, 16);  // "HH:MM" from "YYYY-MM-DD HH:MM:SS ..."
  meta.textContent = ch.items.length > 1
    ? `${shortTime} · ${ch.items.length}`
    : shortTime;
  head.appendChild(meta);

  wrap.appendChild(head);
  for (const it of ch.items) wrap.appendChild(renderItem(it));
  return wrap;
}

function renderItem(it) {
  const row = document.createElement('article');
  row.className = 'sl-item';
  row.dataset.key = it.key;
  row.dataset.status = (effectiveItem(it).status || 'AWAITING YOUR REPLY').toUpperCase();

  const bar = document.createElement('div');
  bar.className = 'sl-item-bar';
  row.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'sl-item-body';
  const head = document.createElement('div');
  head.className = 'sl-item-head';
  const from = document.createElement('span');
  from.className = 'sl-item-from';
  from.textContent = cleanName(it.last_from || '');
  const time = document.createElement('span');
  time.className = 'sl-item-time';
  time.textContent = (it.last_time || '').slice(11, 16);
  head.appendChild(from); head.appendChild(time);
  body.appendChild(head);

  const msg = document.createElement('div');
  msg.className = 'sl-item-msg';
  msg.textContent = it.last_text || '';
  body.appendChild(msg);

  if (it.msg_count > 1 && it.participants && it.participants.length > 1) {
    const others = it.participants.filter(p => !isMe(p));
    if (others.length) {
      const thread = document.createElement('div');
      thread.className = 'sl-item-thread';
      const preview = others.slice(0, 2).join(', ');
      const extra = others.length > 2 ? ` +${others.length - 2}` : '';
      thread.textContent = `${it.msg_count} msgs · ${preview}${extra}`;
      body.appendChild(thread);
    }
  }
  row.appendChild(body);
  return row;
}

function applyFilter(xs) { return xs; }  // Task 9 implements
function updateCounts() {}                // Task 9
function updateFreshness() {              // Task 12 completes
  const f = document.getElementById('freshness');
  if (!f || !raw) return;
  const n = items.length;
  f.textContent = `${n} · ${raw.refreshed_at || 'unknown'}`;
}

function effectiveItem(it) {
  const ov = overrides[it.key] || {};
  return {
    status: ov.status || it.status,
    needs_reply: (ov.needs_reply !== undefined) ? ov.needs_reply : it.needs_reply,
    snoozed: !!ov.snoozed,
  };
}

// ---------- Helpers ----------
function sumResults(raw, key) {
  const qs = (raw && raw.search_results && raw.search_results[key]) || [];
  return qs.reduce((n, q) => n + ((q.results||[]).length), 0);
}
function fmtHuman(iso) {
  if (!iso) return iso;
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())} ${months[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtRelative(iso) {
  const then = Date.parse(iso);
  if (isNaN(then)) return iso;
  const diff = (Date.now() - then) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}
function formatTime(t) {
  if (!t) return '';
  // "2026-04-21 13:18:16 IST" → "13:18 · 21 Apr"
  const m = t.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
  if (!m) return t;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${m[4]}:${m[5]} · ${parseInt(m[3],10)} ${months[parseInt(m[2],10)-1]}`;
}
function snip(s, n) {
  s = (s||'').trim(); if (s.length <= n) return s; return s.slice(0,n) + '…';
}
function escapeHtml(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
