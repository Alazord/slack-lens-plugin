function inferStatus({channel_name, lastIsMe, lastText, msgs}) {
  // Heuristics — user's overrides (if any) win at render time. Three
  // upgrades over the v0.1 regex-only version:
  //   (a) word-bounded patterns: "check" no longer matches "checkout"
  //       and "fixed" no longer matches "prefixed".
  //   (b) cheap negation guard: "not resolved" / "no blocker" / "didn't
  //       check" no longer trip the positive path.
  //   (c) look-back when my last reply is a short ack: filler like "ok",
  //       "thanks", "will do" shouldn't flip a thread to WAITING when
  //       the previous non-me message still held the real ask. We fall
  //       back to scoring the previous non-me message's text instead.
  const DONE_RE   = /\b(resolved|fixed|merged|done|thanks,?\s*done|closed|closing|lgtm|ship(?:ped|ping)?)\b/i;
  const URGENT_RE = /\b(eta|breach|urgent|blocker|asap|p0|p1|critical|high\s*priority)\b/i;
  const ASK_RE    = /\b(check|verify|review|confirm|can\s+you|could\s+you|please|need\s+to|pr\s*#?\d+)\b/i;

  function matchesPositive(re, text) {
    if (!text) return false;
    const m = re.exec(text);
    if (!m) return false;
    // Look at the 12 chars immediately before the match; if any common
    // negator is within that window, treat the whole thing as a miss.
    // Not linguistically rigorous, but handles the frequent false
    // positives we saw in practice without a full NLU pass.
    const ctx = text.slice(Math.max(0, m.index - 12), m.index).toLowerCase();
    if (/\b(not|no|n't|never|without)\b/.test(ctx)) return false;
    return true;
  }

  const lastT = (lastText || '').toLowerCase();
  if (matchesPositive(DONE_RE, lastT)) return {status:'DONE', needs_reply:false};

  // Short-reply look-back: my last message might be a filler ack hiding
  // someone else's unanswered ask. Threshold 15 chars catches "ok",
  // "thanks", "will do", "looking", "sounds good" — not full answers.
  let effectiveText = lastT;
  let effectiveIsMe = lastIsMe;
  if (lastIsMe && lastText && lastText.trim().length < 15 && msgs && msgs.length >= 2) {
    const allButLast = msgs.slice(0, -1);
    for (let i = allButLast.length - 1; i >= 0; i--) {
      if (!isMe(allButLast[i].from)) {
        effectiveText = (allButLast[i].text || '').toLowerCase();
        effectiveIsMe = false;
        break;
      }
    }
  }

  if (effectiveIsMe) return {status:'WAITING', needs_reply:false};
  if (matchesPositive(URGENT_RE, effectiveText)) return {status:'BACKLOG', needs_reply:true};
  if (matchesPositive(ASK_RE, effectiveText))    return {status:'AWAITING YOUR REPLY', needs_reply:true};
  return {status:'AWAITING YOUR REPLY', needs_reply:true};
}

// ---------- Rendering ----------

// Group items by channel_id, then split into three buckets:
//   vip   — VIP channels / DMs / channels containing a VIP mention
//   left  — non-VIP channels AND non-VIP group DMs (higher signal, left column)
//   right — non-VIP 1:1 DMs (right column)
// Each channel: { key, name, display, kind, is_vip, is_group_dm, last_ts, last_time, items }
function partitionByChannel(flatItems) {
  const byKey = new Map();
  for (const it of flatItems) {
    if (!byKey.has(it.channel_key)) {
      byKey.set(it.channel_key, {
        key: it.channel_key,
        name: it.channel_name || it.channel_id,
        display: it.channel_display || it.channel_name || it.channel_id,
        kind: it.kind,
        is_vip: false,
        is_group_dm: isGroupDM(it.channel_name),
        last_ts: 0,
        last_time: '',
        max_score: 0,
        top_tier: 'P3',
        items: [],
      });
    }
    const ch = byKey.get(it.channel_key);
    ch.items.push(it);
    if (it.channel_is_vip) ch.is_vip = true;
    if ((it.last_ts || 0) > ch.last_ts) {
      ch.last_ts = it.last_ts;
      ch.last_time = it.last_time;  // kept for display only
    }
    // Track the highest-priority item in the channel so channel-level
    // sort surfaces "this channel has something urgent" even if newer
    // items in other channels are uneventful. P0 in a channel bumps the
    // whole channel block above a recency-only sort would have placed it.
    if ((it.score || 0) > (ch.max_score || 0)) {
      ch.max_score = it.score;
      ch.top_tier  = it.tier;
    }
  }
  const all = Array.from(byKey.values());
  // Channel sort: composite score desc, recency as tiebreaker. Same
  // shape as item-level sort in normalize() — ensures consistency.
  const byScore = (a, b) =>
    (b.max_score || 0) - (a.max_score || 0) ||
    (b.last_ts   || 0) - (a.last_ts   || 0);

  const vip   = all.filter(c => c.is_vip).sort(byScore);
  const left  = all.filter(c => !c.is_vip && (c.kind === 'channel' || c.is_group_dm)).sort(byScore);
  const right = all.filter(c => !c.is_vip && c.kind === 'dm' && !c.is_group_dm).sort(byScore);
  return { vip, left, right, total: all.length };
}

// Route an item by its inference status into one tracker lane:
//   board   — AWAITING YOUR REPLY / BACKLOG / IN PROGRESS (the user's move)
//   waiting — WAITING (blocked on someone else; tracked, subordinate lane)
//   done    — DONE → Done(derived) section
//   dropped — DISCUSSION / FYI (not actionable → not rendered at all)
//   unknown — no inference yet (couldn't read; footer, never a fake task)
// Routing is status-only: the loose needs_action / empty-actions gate is gone.
function statusGroup(it) {
  const s = (it.status || 'UNKNOWN').toUpperCase();
  if (s === 'DONE')                      return 'done';
  if (s === 'DISCUSSION' || s === 'FYI') return 'dropped';
  if (s === 'WAITING')                   return 'waiting';
  if (s === 'UNKNOWN')                   return 'unknown';
  return 'board';   // AWAITING YOUR REPLY / BACKLOG / IN PROGRESS
}

function groupItems(allItems) {
  const g = { board: [], waiting: [], done: [], dropped: [], unknown: [] };
  for (const it of allItems) g[statusGroup(it)].push(it);
  return g;
}

function renderWaitingLane(waitingItems) {
  const sec   = document.getElementById('waitingSection');
  const inner = document.getElementById('waitingInner');
  const count = document.getElementById('waitingCount');
  if (!sec || !inner) return;
  inner.innerHTML = '';
  const parts = partitionByChannel(waitingItems);
  for (const ch of [...parts.vip, ...parts.left, ...parts.right]) {
    inner.appendChild(renderChannel(ch, 'waiting'));
  }
  if (count) count.textContent = waitingItems.length;
  sec.hidden = waitingItems.length === 0;
}

function renderUnknownFooter(unknownItems) {
  const f = document.getElementById('unknownFooter');
  if (!f) return;
  const n = unknownItems.length;
  f.hidden = n === 0;
  f.textContent = n === 0 ? ''
    : `${n} thread${n === 1 ? '' : 's'} couldn’t be read by triage — not shown on the board.`;
}

function renderDoneSection(closedItems) {
  const sec   = document.getElementById('doneSection');
  const inner = document.getElementById('doneInner');
  const count = document.getElementById('doneCount');
  if (!sec || !inner) return;
  inner.innerHTML = '';
  const doneParts = partitionByChannel(closedItems);
  for (const ch of [...doneParts.vip, ...doneParts.left, ...doneParts.right]) {
    inner.appendChild(renderChannel(ch, 'done'));
  }
  if (count) count.textContent = closedItems.length;
  sec.hidden = closedItems.length === 0;
}

function render() {
  const vipBand   = document.getElementById('vipBand');
  const vipInner  = document.getElementById('vipBandInner');
  const leftCol   = document.getElementById('leftCol');
  const rightCol  = document.getElementById('rightCol');
  const empty     = document.getElementById('emptyState');
  if (!vipInner || !leftCol || !rightCol) return;
  vipInner.innerHTML = '';
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  const shown = applyFilter(items);
  // Status-only routing: ONLY the on-me board (AWAITING/BACKLOG/IN PROGRESS)
  // fills the main columns. WAITING → its own collapsed lane, DONE → the
  // Done(derived) section, UNKNOWN → a footer count, DISCUSSION/FYI → dropped.
  // Lanes render here, before the empty-state early-returns, so they persist.
  const grouped = groupItems(shown);
  const active = [...grouped.board];
  const parts = partitionByChannel(active);
  const visibleCount = active.length + grouped.waiting.length + grouped.done.length;
  renderWaitingLane(grouped.waiting);
  renderDoneSection(grouped.done);
  renderUnknownFooter(grouped.unknown);
  // grouped.dropped (DISCUSSION/FYI) is intentionally not rendered.

  // Four empty-state paths — the differentiation matters for UX, so keep
  // each branch distinct. "Never refreshed" and "refreshed but silent"
  // look identical at the raw-count level but feel very different to users.
  const neverRefreshed = !raw || !raw.refreshed_at ||
    (!raw.search_results && !raw.threads);
  if (neverRefreshed) {
    empty.hidden = false;
    empty.innerHTML =
      '<h4>No cache loaded yet</h4>' +
      '<p>Say <code>refresh slacklens</code> in Claude to populate this dashboard. ' +
      'Refreshing the page won\'t help — the embedded cache is still empty.</p>';
    vipBand.hidden = true;
    return;
  }

  const activelyFiltered =
    filter.scope !== 'all' ||
    (Array.isArray(filter.status) && filter.status.length > 0) ||
    (filter.query || '').trim() !== '';

  if (visibleCount === 0 && activelyFiltered) {
    empty.hidden = false;
    empty.innerHTML =
      '<h4>Nothing matches</h4>' +
      '<p>Your filter did not match any threads.</p>' +
      '<button id="emptyClear" type="button">Clear filter</button>';
    const clear = document.getElementById('emptyClear');
    if (clear) clear.onclick = () => {
      filter.scope = 'all';
      filter.status = [];
      filter.query = '';
      const si = document.getElementById('searchInput');
      if (si) si.value = '';
      document.querySelectorAll('#categoryPills .sl-pill').forEach(b =>
        b.classList.toggle('active', b.dataset.scope === 'all'));
      document.querySelectorAll('#statusPills .sl-pill').forEach(b => b.classList.remove('active'));
      render();
    };
    vipBand.hidden = true;
    return;
  }

  if (visibleCount === 0) {
    // Genuine quiet period — cache is fresh, Slack just returned nothing
    // actionable. Show when we last checked so the user can tell this apart
    // from "maybe refresh is broken?".
    empty.hidden = false;
    const t = Date.parse(raw.refreshed_at);
    const ageHours = isFinite(t) ? (Date.now() - t) / 3600000 : null;
    const ageStr = ageHours != null ? humanAge(ageHours) : 'recently';
    empty.innerHTML =
      '<h4>Nothing in the last 48 hours</h4>' +
      `<p>Cache is fresh (refreshed ${ageStr}). Catch your breath — or say ` +
      '<code>refresh slacklens</code> to check again.</p>';
    vipBand.hidden = true;
    return;
  }
  empty.hidden = true;

  // VIP band — only show if non-empty
  vipBand.hidden = parts.vip.length === 0;
  for (const ch of parts.vip)   vipInner.appendChild(renderChannel(ch, 'vip'));
  for (const ch of parts.left)  leftCol.appendChild(renderChannel(ch, 'channel'));
  for (const ch of parts.right) rightCol.appendChild(renderChannel(ch, 'dm'));

  updateCounts();
  updateFreshness();
}

function renderChannel(ch, colKind) {
  const wrap = document.createElement('section');
  wrap.className = 'sl-channel';
  wrap.dataset.vip = ch.is_vip ? '1' : '0';
  wrap.dataset.col = colKind || '';

  const head = document.createElement('header');
  head.className = 'sl-channel-head';
  const name = document.createElement('div');
  name.className = 'sl-channel-name';
  name.textContent = ch.display;
  head.appendChild(name);

  const meta = document.createElement('div');
  meta.className = 'sl-channel-meta';
  const shortTime = (ch.last_time || '').slice(11, 16);  // "HH:MM" from "YYYY-MM-DD HH:MM:SS ..."
  meta.textContent = ch.items.length > 1
    ? `${shortTime} · ${ch.items.length}`
    : shortTime;
  head.appendChild(meta);

  wrap.appendChild(head);
  for (const it of ch.items) wrap.appendChild(renderItem(it));
  return wrap;
}

function renderItem(it) {
  const row = document.createElement('article');
  row.className = 'sl-item';
  // Full status in title so narrow cards (chip hidden via container-query)
  // still surface it on hover.
  row.title = STATUS_LABELS[(it.status || 'AWAITING YOUR REPLY').toUpperCase()] || '';
  row.dataset.key = it.key;
  row.dataset.status = (it.status || 'AWAITING YOUR REPLY').toUpperCase();

  const bar = document.createElement('div');
  bar.className = 'sl-item-bar';
  row.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'sl-item-body';
  const head = document.createElement('div');
  head.className = 'sl-item-head';
  const from = document.createElement('span');
  from.className = 'sl-item-from';
  from.textContent = cleanName(it.last_from || '');
  const right = document.createElement('span');
  right.className = 'sl-item-head-right';
  const status = document.createElement('span');
  status.className = 'sl-item-status';
  status.textContent = STATUS_LABELS[row.dataset.status] || row.dataset.status;
  const time = document.createElement('span');
  time.className = 'sl-item-time';
  time.textContent = (it.last_time || '').slice(11, 16);
  right.appendChild(status); right.appendChild(time);
  head.appendChild(from); head.appendChild(right);
  body.appendChild(head);

  const msg = document.createElement('div');
  msg.className = 'sl-item-msg';
  const actions = it.inference_actions;
  if (Array.isArray(actions) && actions.length > 0) {
    msg.dataset.source = 'inference';
    if (actions.length === 1) {
      // One action — inline plain text, no bullet
      msg.textContent = actions[0];
    } else {
      // Multi-action — numbered list, full height, no clip. These are
      // usually assigned tasks a user wants to see in full; clipping
      // to one line buries the substance.
      const ol = document.createElement('ol');
      ol.className = 'sl-item-actions';
      for (const a of actions) {
        const li = document.createElement('li');
        li.textContent = a;
        ol.appendChild(li);
      }
      msg.appendChild(ol);
    }
  } else if (Array.isArray(actions) && actions.length === 0) {
    // Inference ran, concluded nothing for the user to do
    msg.textContent = 'No action needed';
    msg.dataset.source = 'inference-empty';
    msg.classList.add('sl-item-msg--muted');
  } else {
    // Pre-v3 cache OR inference failed — fall back to raw preview
    msg.textContent = formatSlackText(it.last_text);
    msg.dataset.source = 'raw';
  }
  body.appendChild(msg);

  if (it.msg_count > 1 && it.participants && it.participants.length > 1) {
    const others = it.participants.filter(p => !isMe(p));
    if (others.length) {
      const thread = document.createElement('div');
      thread.className = 'sl-item-thread';
      const preview = others.slice(0, 2).join(', ');
      const extra = others.length > 2 ? ` +${others.length - 2}` : '';
      // Badge order: replies → people → names. reply_count is the truest
      // "busy thread" signal (excludes the parent), so lead with it when
      // available. Falls back to msg_count on pre-v2 caches where
      // reply_count is null (see threadReplyCount()).
      const nReplies = (typeof it.reply_count === 'number') ? it.reply_count : null;
      const countBadge = nReplies !== null
        ? `${nReplies} ${nReplies === 1 ? 'reply' : 'replies'}`
        : `${it.msg_count} msgs`;
      const pplBadge = `${it.participants.length} ppl`;
      thread.textContent = `${countBadge} · ${pplBadge} · ${preview}${extra}`;
      body.appendChild(thread);
    }
  }
  row.appendChild(body);

  // Action tail (read-only): jump to Slack + copy permalink. The dashboard
  // never mutates task state — you close a task by acting in Slack.
  const tail = document.createElement('div');
  tail.className = 'sl-item-tail';

  const openBtn = document.createElement('button');
  openBtn.className = 'sl-item-go primary';
  openBtn.type = 'button';
  openBtn.dataset.action = 'open';
  openBtn.title = 'Open in Slack';
  openBtn.setAttribute('aria-label', 'Open in Slack');
  openBtn.textContent = '↗';
  tail.appendChild(openBtn);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'sl-item-go';
  copyBtn.type = 'button';
  copyBtn.dataset.action = 'copy';
  copyBtn.title = 'Copy permalink';
  copyBtn.setAttribute('aria-label', 'Copy permalink');
  copyBtn.textContent = '⎘';
  tail.appendChild(copyBtn);

  row.appendChild(tail);

  return row;
}

function applyFilter(xs) {
  const q = (filter.query || '').toLowerCase().trim();
  // Migration safety: allow filter.status as string or array
  const statusList = Array.isArray(filter.status)
    ? filter.status
    : (filter.status ? [filter.status] : []);

  // Read-only model: status/needs_reply come straight from the cache
  // inference. Closed items (DONE/FYI/no-action) are NOT hidden here —
  // groupItems routes them to the collapsed Done(derived) section.
  return xs.filter(it => {
    // Scope
    if (filter.scope === 'needs_reply'  && !it.needs_reply)      return false;
    if (filter.scope === 'mentions'     && !it.is_mention)       return false;
    if (filter.scope === 'dms'          && it.kind !== 'dm')     return false;
    if (filter.scope === 'channels'     && it.kind !== 'channel') return false;

    // Status (multi-select)
    if (statusList.length && !statusList.includes((it.status || '').toUpperCase())) return false;

    // Search across channel/person/text/participants
    if (q) {
      const hay = (it.channel_display + ' ' + (it.last_from || '') + ' ' +
                   (it.last_text || '') + ' ' + (it.participants || []).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }

    return true;
  });
}

// Pure: tally category + status counts over the FULL item set (not the
// filtered view) so pills always show the true totals.
function computeCounts(allItems) {
  const counts = { all: allItems.length, needs_reply: 0, mentions: 0, dms: 0, channels: 0 };
  const statusCounts = { 'BACKLOG': 0, 'IN PROGRESS': 0, 'WAITING': 0, 'DONE': 0, 'DISCUSSION': 0, 'AWAITING YOUR REPLY': 0 };
  for (const it of allItems) {
    if (it.needs_reply)         counts.needs_reply++;
    if (it.is_mention)          counts.mentions++;
    if (it.kind === 'dm')       counts.dms++;
    if (it.kind === 'channel')  counts.channels++;
    const s = (it.status || 'AWAITING YOUR REPLY').toUpperCase();
    if (statusCounts[s] !== undefined) statusCounts[s]++;
  }
  return { counts, statusCounts };
}

function updateCounts() {
  const { counts, statusCounts } = computeCounts(items);
  document.querySelectorAll('#categoryPills .sl-pill').forEach(btn => {
    const k = btn.dataset.scope;
    const c = btn.querySelector('.count');
    if (c && counts[k] !== undefined) c.textContent = counts[k];
  });
  document.querySelectorAll('#statusPills .sl-pill').forEach(btn => {
    const k = btn.dataset.status;
    const c = btn.querySelector('.count');
    if (c && statusCounts[k] !== undefined) c.textContent = statusCounts[k];
  });
}

function bootFilters() {
  // Category pills (single-select)
  document.querySelectorAll('#categoryPills .sl-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      filter.scope = btn.dataset.scope;
      document.querySelectorAll('#categoryPills .sl-pill').forEach(b =>
        b.classList.toggle('active', b === btn));
      render();
    });
  });
  // Status pills (multi-select)
  document.querySelectorAll('#statusPills .sl-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.status;
      if (!Array.isArray(filter.status)) filter.status = [];
      const i = filter.status.indexOf(s);
      if (i >= 0) { filter.status.splice(i, 1); btn.classList.remove('active'); }
      else        { filter.status.push(s);      btn.classList.add('active'); }
      render();
    });
  });
  // Search (debounced 150ms)
  const input = document.getElementById('searchInput');
  let tmr = null;
  if (input) input.addEventListener('input', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => { filter.query = input.value; render(); }, 150);
  });
  // Done(derived) collapse toggle
  const dt = document.getElementById('doneToggle');
  const di = document.getElementById('doneInner');
  if (dt && di) dt.addEventListener('click', () => {
    const open = di.hidden; di.hidden = !open; dt.setAttribute('aria-expanded', String(open));
  });
  // Waiting-lane collapse toggle (mirrors Done)
  const wt = document.getElementById('waitingToggle');
  const wi = document.getElementById('waitingInner');
  if (wt && wi) wt.addEventListener('click', () => {
    const open = wi.hidden; wi.hidden = !open; wt.setAttribute('aria-expanded', String(open));
  });
}
const STALE_CACHE_HOURS = 12;      // amber: ">12h" — worth refreshing soon
const VERY_STALE_CACHE_HOURS = 24; // red: ">24h" — data is a day old

function updateFreshness() {
  const f = document.getElementById('freshness');
  if (!f) return;
  const total = items.length;
  if (!raw || !raw.refreshed_at) {
    f.textContent = `${total} · no data`;
    f.removeAttribute('data-stale');
    f.removeAttribute('title');
    return;
  }
  const t = Date.parse(raw.refreshed_at);
  const ageHours = (Date.now() - t) / 3600000;
  // Show both the precise refresh time AND the relative age, so the user
  // can decide at a glance whether to force another refresh. Format:
  //   "21 · 14:30 · 2h ago"
  //   "21 · Apr 21 14:30 · 2d ago"   (older than 24h)
  const d = new Date(t);
  const pad = n => String(n).padStart(2, '0');
  const hhmm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const datePrefix = (ageHours >= 24)
    ? `${months[d.getMonth()]} ${d.getDate()} `
    : '';
  f.textContent = `${total} · ${datePrefix}${hhmm} · ${humanAge(ageHours)}`;
  f.title = `Cache refreshed at ${raw.refreshed_at}. Say "refresh slacklens" for a delta update, "deep refresh slacklens" to force a full 48h re-fetch.`;
  let staleLevel = '0';
  if (ageHours > VERY_STALE_CACHE_HOURS)   staleLevel = '2';
  else if (ageHours > STALE_CACHE_HOURS)   staleLevel = '1';
  f.dataset.stale = staleLevel;
}

function humanAge(h) {
  if (h < 0.05) return 'just now';
  if (h < 1)    return `${Math.round(h * 60)}m ago`;
  if (h < 24)   return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

// Read-only model: an item's status/needs_reply come straight from the
// cache inference. Kept as a thin shim so existing call sites compile.
function effectiveItem(it) {
  return { status: it.status, needs_reply: it.needs_reply, note: '' };
}

// ========================================================================
// Density toggle (slacklens.density: 'compact' | 'balanced' | 'spacious')
// ========================================================================
const DENSITY_KEY = 'slacklens.density';
const DENSITY_VALUES = ['compact', 'balanced', 'spacious'];

function applyDensity(d) {
  if (!DENSITY_VALUES.includes(d)) d = 'balanced';
  document.documentElement.setAttribute('data-density', d);
  document.querySelectorAll('.sl-density-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.density === d);
  });
  try { localStorage.setItem(DENSITY_KEY, d); } catch (_) {}
}

function bootDensity() {
  let d;
  try { d = localStorage.getItem(DENSITY_KEY); } catch (_) { d = null; }
  applyDensity(d || 'balanced');
  document.querySelectorAll('.sl-density-btn').forEach(btn => {
    btn.addEventListener('click', () => applyDensity(btn.dataset.density));
  });
}

// ========================================================================
// Theme toggle (slacklens.theme: 'auto' | 'light' | 'dark'; default 'auto')
// ========================================================================
const THEME_KEY = 'slacklens.theme';
const THEME_CYCLE = ['auto', 'light', 'dark'];

function currentSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(t) {
  if (!THEME_CYCLE.includes(t)) t = 'auto';
  const effective = (t === 'auto') ? currentSystemTheme() : t;
  // For 'auto', let the prefers-color-scheme media query drive colors by
  // leaving data-theme unset. For 'light' or 'dark', set data-theme
  // explicitly so the media query's :not([data-theme]) branch doesn't
  // override the user's explicit choice.
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else              document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = (effective === 'dark') ? '☼' : '☾';
    btn.title = 'Theme: ' + t + ' (click to cycle)';
  }
  try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
}

function bootTheme() {
  let t;
  try { t = localStorage.getItem(THEME_KEY); } catch (_) { t = null; }
  applyTheme(t || 'auto');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', () => {
    const current = localStorage.getItem(THEME_KEY) || 'auto';
    const next = THEME_CYCLE[(THEME_CYCLE.indexOf(current) + 1) % THEME_CYCLE.length];
    applyTheme(next);
  });
  // Respond to system changes while on auto
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    const current = localStorage.getItem(THEME_KEY) || 'auto';
    if (current === 'auto') applyTheme('auto');
  });
}

// ========================================================================
// Keyboard shortcuts
//   /  focus search     T  cycle theme     D  cycle density
//   ESC close panel / clear focused input
//   J/K  next/prev item (nice-to-have)
// ========================================================================
function bootKeyboard() {
  document.addEventListener('keydown', e => {
    const active = document.activeElement;
    const inInput = active && ['INPUT', 'TEXTAREA'].includes(active.tagName);

    if (e.key === 'Escape') {
      if (inInput) active.blur();
      // side panel ESC is handled by bootSidePanel's own listener
      return;
    }
    if (inInput) return;

    if (e.key === '/') { e.preventDefault(); const si = document.getElementById('searchInput'); if (si) si.focus(); return; }
    if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      const current = localStorage.getItem(THEME_KEY) || 'auto';
      const next = THEME_CYCLE[(THEME_CYCLE.indexOf(current) + 1) % THEME_CYCLE.length];
      applyTheme(next);
      return;
    }
    if (e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      const current = localStorage.getItem(DENSITY_KEY) || 'balanced';
      const next = DENSITY_VALUES[(DENSITY_VALUES.indexOf(current) + 1) % DENSITY_VALUES.length];
      applyDensity(next);
      return;
    }
    if (e.key === 'j' || e.key === 'k') {
      e.preventDefault();
      const rows = Array.from(document.querySelectorAll('.sl-item'));
      if (!rows.length) return;
      const focused = document.querySelector('.sl-item[data-kb-focus="1"]');
      let idx = focused ? rows.indexOf(focused) : -1;
      rows.forEach(r => r.removeAttribute('data-kb-focus'));
      idx = (e.key === 'j') ? Math.min(idx + 1, rows.length - 1) : Math.max(idx - 1, 0);
      const next = rows[Math.max(0, idx)];
      next.setAttribute('data-kb-focus', '1');
      next.scrollIntoView({ block: 'nearest' });
    }
  });
}

// ---------- Wire up ----------
bootDensity();
bootTheme();
bootFilters();
bootSidePanel();
bootKeyboard();
loadCache();

// ========================================================================
// Side panel
// ========================================================================
let panelItemKey = null;     // key of currently-open item (null = closed)
let panelTriggerEl = null;   // element that opened it, for focus restoration

function findItem(key) { return items.find(it => it.key === key); }

function threadMessagesFor(it) {
  // Find a full thread in raw.threads by matching channel_id prefix;
  // fall back to a synthetic single-message array.
  if (raw && raw.threads) {
    const key = Object.keys(raw.threads).find(k => k.startsWith(it.channel_id + ':'));
    if (key && raw.threads[key] && raw.threads[key].messages) {
      return raw.threads[key].messages;
    }
  }
  return [{ from: it.last_from, ts: '0', time: it.last_time, text: it.last_text, permalink: it.permalink }];
}

function openPanel(itemKey, triggerEl) {
  const it = findItem(itemKey);
  if (!it) return;
  panelItemKey = itemKey;
  panelTriggerEl = triggerEl || null;

  document.getElementById('panelChannel').textContent = it.channel_display || it.channel_name || it.channel_id;
  document.getElementById('panelChannelType').textContent =
    it.kind === 'dm' ? 'Direct message' : (it.kind === 'channel' ? 'Channel' : 'Thread');
  document.getElementById('panelStatus').textContent =
    STATUS_LABELS[(it.status || 'UNKNOWN').toUpperCase()] || it.status || 'Unread by triage';

  // Read-only action handlers (bound fresh each open so they close over `it`).
  document.getElementById('actOpen').onclick = () => { if (it.permalink) window.open(it.permalink, '_blank'); };
  document.getElementById('actCopy').onclick = () => { if (it.permalink && navigator.clipboard) navigator.clipboard.writeText(it.permalink); };

  // Render the thread messages
  const threadEl = document.getElementById('panelThread');
  threadEl.innerHTML = '';

  // v3: "What to do" block at the top of the drawer — full actions
  // list from the inference, not just the first one the card shows.
  const infActs = it.inference_actions;
  if (Array.isArray(infActs) && infActs.length > 0) {
    const box = document.createElement('div');
    box.className = 'sl-panel-actions-block';
    const head = document.createElement('div');
    head.className = 'sl-panel-actions-head';
    head.textContent = 'What to do';
    box.appendChild(head);
    const ul = document.createElement('ul');
    ul.className = 'sl-panel-actions-list';
    for (const a of infActs) {
      const li = document.createElement('li');
      li.textContent = a;
      ul.appendChild(li);
    }
    box.appendChild(ul);
    threadEl.appendChild(box);
  }

  for (const m of threadMessagesFor(it)) {
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isMe(m.from) ? ' me' : '');
    const head = document.createElement('div');
    head.className = 'msg-head';
    const fromEl = document.createElement('span');
    fromEl.className = 'msg-from';
    fromEl.textContent = cleanName(m.from || '');
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = (m.time || '').slice(11, 16) || m.ts;
    head.appendChild(fromEl); head.appendChild(timeEl);
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = formatSlackText(m.text);
    wrap.appendChild(head); wrap.appendChild(body);
    threadEl.appendChild(wrap);
  }

  // Highlight the selected row in background
  document.querySelectorAll('.sl-item[data-active="1"]').forEach(el => el.removeAttribute('data-active'));
  const row = document.querySelector(`.sl-item[data-key="${CSS.escape(itemKey)}"]`);
  if (row) row.setAttribute('data-active', '1');

  document.getElementById('sidePanel').hidden = false;
  document.getElementById('panelBackdrop').hidden = false;
  document.getElementById('panelClose').focus();
}

function closePanel() {
  panelItemKey = null;
  document.getElementById('sidePanel').hidden = true;
  document.getElementById('panelBackdrop').hidden = true;
  document.querySelectorAll('.sl-item[data-active="1"]').forEach(el => el.removeAttribute('data-active'));
  if (panelTriggerEl && typeof panelTriggerEl.focus === 'function') panelTriggerEl.focus();
  panelTriggerEl = null;
}

// ========================================================================
// Row actions (read-only): open in Slack / copy permalink only.
// ========================================================================
function handleRowAction(action, it) {
  if (!it) return;
  if (action === 'open') { if (it.permalink) window.open(it.permalink, '_blank'); return; }
  if (action === 'copy') { if (it.permalink && navigator.clipboard) navigator.clipboard.writeText(it.permalink); return; }
}

function bootSidePanel() {
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.getElementById('panelBackdrop').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('sidePanel').hidden) closePanel();
  });

  // Click delegation on the channel flow — action buttons first,
  // fall through to row click → open panel.
  document.getElementById('channelFlow').addEventListener('click', e => {
    const actBtn = e.target.closest('.sl-item-go');
    if (actBtn) {
      const row = actBtn.closest('.sl-item');
      handleRowAction(actBtn.dataset.action, findItem(row.dataset.key));
      e.stopPropagation();
      return;
    }
    const row = e.target.closest('.sl-item');
    if (!row) return;
    openPanel(row.dataset.key, row);
  });
}
</script>
