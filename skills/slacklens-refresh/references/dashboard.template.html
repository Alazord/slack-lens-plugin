<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slack Triage — Live</title>
<style>
/* ========================================================================
   Design tokens — applied via :root (light default) + data-theme="dark"
   Densities via data-density="compact|balanced|spacious" (default balanced)
   See docs/superpowers/specs/2026-04-22-slacklens-dashboard-redesign-design.md
   ======================================================================== */
:root {
  /* Typography families */
  --font-serif: "Iowan Old Style", "Palatino", "Hoefler Text", Georgia, serif;
  --font-sans:  -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-mono:  "SF Mono", "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Font sizes — Balanced defaults; overridden per density below */
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-base: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;

  /* Spacing tokens — Balanced defaults; overridden per density below */
  --item-py: 6px;
  --item-gap: 4px;
  --channel-mb: 16px;
  --col-gap: 20px;
  --frame-pad: 24px;
  --chanhead-py: 6px;

  /* Colors — light theme (default) */
  --surface: #faf9f4;
  --surface-2: #fefdf8;
  --border: #e8e5d9;
  --border-faint: #eeeadd;
  --ink: #2a2822;
  --ink-muted: #5a5648;
  --ink-faint: #908b78;
  --vip-red: #b64535;
  --status-red:    #b64535;   /* AWAITING YOUR REPLY */
  --status-amber:  #b8821f;   /* IN PROGRESS */
  --status-blue:   #3a6fa8;   /* BACKLOG */
  --status-violet: #7a4f9a;   /* WAITING */
  --status-teal:   #2f7a72;   /* DISCUSSION */
  --status-gray:   #d6d0bd;   /* (legacy; kept for old item-bar fallbacks) */
  --status-green:  #5a7f5a;   /* DONE */

  /* Column tints — accents for the Channels vs DMs split.
     Accent = visible left-border; bg = tinted wash behind each card. */
  --chan-accent: #3e6f7d;   /* cool teal-slate — channel threads */
  --chan-col-bg: #eef1ee;   /* cooler column backdrop */
  --chan-bg:     #ffffff;   /* crisp card against column backdrop */
  --dm-accent:   #9a6a48;   /* warm sienna — 1:1 DMs */
  --dm-col-bg:   #f2ebde;   /* warmer column backdrop */
  --dm-bg:       #ffffff;   /* crisp card against column backdrop */
  --vip-band-bg: #f5e6e1;   /* warm-red wash behind VIP band */
  --card-shadow: 0 1px 2px rgba(42, 40, 34, 0.05), 0 0 0 1px rgba(42, 40, 34, 0.03);

  /* Misc */
  --stale-cache-hours: 12;  /* freshness meta turns amber past this */
  --transition-theme: 150ms ease;

  /* Composition tokens — card/column/topbar/pill padding. Balanced defaults. */
  --card-pad-y: 10px;   --card-pad-x: 14px;
  --col-pad: 14px;
  --topbar-py: 8px;     --topbar-px: 14px;
  --pill-py: 4px;       --pill-px: 10px;
  --vip-pad-y: 10px;    --vip-pad-x: 14px;
  --section-gap: 22px;  /* vertical rhythm between VIP band and column grid */
  --action-fs: 13px;    /* row action icon size */
  --action-pad: 3px;
}

:root[data-density="compact"] {
  --fs-xs: 10px;  --fs-sm: 11px;  --fs-base: 12px;  --fs-md: 13px;  --fs-lg: 14px;
  --item-py: 3px;  --item-gap: 2px;  --channel-mb: 10px;
  --col-gap: 18px;  --frame-pad: 16px;  --chanhead-py: 4px;
  --card-pad-y: 6px;  --card-pad-x: 10px;
  --col-pad: 10px;
  --topbar-py: 5px;   --topbar-px: 10px;
  --pill-py: 3px;     --pill-px: 8px;
  --vip-pad-y: 8px;   --vip-pad-x: 12px;
  --section-gap: 18px;
  --action-fs: 11px;  --action-pad: 2px;
}
:root[data-density="spacious"] {
  --fs-xs: 12px;  --fs-sm: 13px;  --fs-base: 14px;  --fs-md: 15px;  --fs-lg: 18px;
  --item-py: 10px;  --item-gap: 6px;  --channel-mb: 24px;
  --col-gap: 28px;  --frame-pad: 32px;  --chanhead-py: 8px;
  --card-pad-y: 14px;  --card-pad-x: 18px;
  --col-pad: 20px;
  --topbar-py: 12px;   --topbar-px: 18px;
  --pill-py: 6px;      --pill-px: 14px;
  --vip-pad-y: 14px;   --vip-pad-x: 18px;
  --section-gap: 28px;
  --action-fs: 15px;   --action-pad: 4px;
}

:root[data-theme="dark"] {
  --surface: #1a1814;
  --surface-2: #22201b;
  --border: #2e2b24;
  --border-faint: #262420;
  --ink: #ede8d6;
  --ink-muted: #b0a991;
  --ink-faint: #8a8270;
  --vip-red: #e87b68;
  --status-red:    #e87b68;
  --status-amber:  #d4a33a;
  --status-blue:   #6ea5d6;
  --status-violet: #b58cd0;
  --status-teal:   #5fbab0;
  --status-gray:   #4a4539;
  --status-green:  #7ea97e;
  --chan-accent: #7ab1bf;
  --chan-col-bg: #1c1f1e;
  --chan-bg:     #262320;
  --dm-accent:   #d9a877;
  --dm-col-bg:   #231e18;
  --dm-bg:       #2a2520;
  --vip-band-bg: #2f211d;
  --card-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.03);
}

/* Follow OS default when no explicit theme is set */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --surface: #1a1814; --surface-2: #22201b; --border: #2e2b24; --border-faint: #262420;
    --ink: #ede8d6; --ink-muted: #b0a991; --ink-faint: #8a8270;
    --vip-red: #e87b68; --status-red: #e87b68; --status-amber: #d4a33a;
    --status-blue: #6ea5d6; --status-violet: #b58cd0; --status-teal: #5fbab0;
    --status-gray: #4a4539; --status-green: #7ea97e;
    --chan-accent: #7ab1bf; --chan-col-bg: #1c1f1e; --chan-bg: #262320;
    --dm-accent: #d9a877;   --dm-col-bg: #231e18;   --dm-bg: #2a2520;
    --vip-band-bg: #2f211d;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.03);
  }
}

/* ========================================================================
   Global + layout
   ======================================================================== */
html { background: var(--surface); color: var(--ink); transition: background-color var(--transition-theme), color var(--transition-theme); }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.4;
  margin: 0;
  padding: var(--frame-pad);
  max-width: 1800px;
  margin-inline: auto;
  color: var(--ink);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }

/* Make [hidden] actually hide elements whose class rules set an explicit
   display (.sl-panel uses flex — without this, hidden gets overridden by
   class specificity and the element stays visible). This is the canonical
   fix for the "panel won't close" footgun. */
[hidden] { display: none !important; }

.sl-flow {
  margin-top: 20px;
}

/* VIP band — full-width, always on top, warm accent */
.sl-vip-band {
  position: relative;
  background: var(--vip-band-bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--vip-red);
  border-radius: 6px;
  padding: var(--vip-pad-y) var(--vip-pad-x) calc(var(--vip-pad-y) + 2px);
  margin-bottom: var(--section-gap);
}
.sl-vip-band::before {
  content: "★ HIGH PRIORITY";
  display: block;
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--vip-red);
  margin-bottom: 8px;
}
/* Inside the band, render channel cards in a 2-col masonry so dense VIP
   activity still fits above the fold. */
@media (min-width: 1024px) {
  .sl-vip-band-inner { columns: 2; column-gap: var(--col-gap); }
  .sl-vip-band-inner .sl-channel { break-inside: avoid; display: block; }
}

/* Two-column split: left = channels + group DMs, right = 1:1 DMs */
.sl-grid-2col {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--col-gap);
}
@media (min-width: 1024px) {
  .sl-grid-2col {
    grid-template-columns: minmax(0, 11fr) minmax(0, 9fr);
  }
}
.sl-col { min-width: 0; padding: var(--col-pad); border-radius: 8px; }
.sl-col--channels { background: var(--chan-col-bg); }
.sl-col--dms      { background: var(--dm-col-bg); }
.sl-col::before {
  display: block;
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
}
.sl-col--channels::before { content: "# CHANNELS"; color: var(--chan-accent); }
.sl-col--dms::before      { content: "@ DIRECT MESSAGES"; color: var(--dm-accent); }
.sl-col:empty { display: none; }

/* Masonry within columns at wide viewports: cards pack horizontally
   instead of leaving a tall empty vertical strip beside a denser column. */
@media (min-width: 1280px) {
  .sl-col--channels { column-count: 2; column-gap: var(--col-gap); }
  .sl-col--channels > .sl-channel { break-inside: avoid; display: block; }
  .sl-col::before { column-span: all; }
}
@media (min-width: 1600px) {
  .sl-col--dms { column-count: 2; column-gap: var(--col-gap); }
  .sl-col--dms > .sl-channel { break-inside: avoid; display: block; }
}

/* Per-column channel card tint */
.sl-col--channels .sl-channel {
  border-left: 3px solid var(--chan-accent);
  background: var(--chan-bg);
  padding: var(--card-pad-y) var(--card-pad-x);
  border-radius: 5px;
  box-shadow: var(--card-shadow);
}
.sl-col--dms .sl-channel {
  border-left: 3px solid var(--dm-accent);
  background: var(--dm-bg);
  padding: var(--card-pad-y) var(--card-pad-x);
  border-radius: 5px;
  box-shadow: var(--card-shadow);
}
.sl-vip-band .sl-channel {
  background: var(--surface);
  border-left: 3px solid var(--vip-red);
  padding: var(--card-pad-y) var(--card-pad-x);
  border-radius: 5px;
  box-shadow: var(--card-shadow);
}

.sl-footer {
  margin-top: 32px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  text-align: right;
}
.sl-footer code { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

/* ========================================================================
   Channel header
   ======================================================================== */
.sl-channel {
  margin-bottom: var(--channel-mb);
  /* Each card is its own container — lets item rows reshape based on the
     card's actual rendered width (not viewport). Solves the masonry case
     where cards can narrow to ~300px and chip/actions crowd out the name. */
  container-type: inline-size;
  container-name: channel;
}

/* Responsive action/meta shedding based on card width */
@container channel (max-width: 260px) {
  /* Only hide the status chip on truly tiny cards — the DM column sits
     around 300-340px and legibility of the chip matters more than the
     couple of extra pixels it eats. */
  .sl-item-status { display: none; }
}
@container channel (max-width: 320px) {
  /* Collapse snooze into the ⋯ menu when narrow; keep the Slack jump
     button (primary CTA) always visible. */
  .sl-item-go[data-action="snooze"] { display: none; }
}
.sl-channel-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: var(--chanhead-py) 0;
  border-bottom: 1px solid var(--border-faint);
  margin-bottom: var(--item-gap);
}
.sl-channel-name {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: var(--fs-md);
  letter-spacing: -0.005em;
  color: var(--ink);
  max-width: calc(100% - 100px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sl-col--channels .sl-channel-head { border-bottom-color: color-mix(in srgb, var(--chan-accent) 20%, var(--border-faint)); }
.sl-col--dms .sl-channel-head      { border-bottom-color: color-mix(in srgb, var(--dm-accent) 20%, var(--border-faint)); }
.sl-channel-meta {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ========================================================================
   Item row
   ======================================================================== */
.sl-item {
  position: relative;
  display: grid;
  /* minmax(0, 1fr) lets the body column shrink below its content width;
     otherwise long messages blow out the row and ignore text-overflow.
     Third column = action tail (Slack jump + snooze always visible,
     hover-reveal cluster appears to their left). */
  grid-template-columns: 2px minmax(0, 1fr) auto;
  gap: 10px;
  padding: var(--item-py) 6px var(--item-py) 0;
  border-bottom: 1px solid var(--border-faint);
  cursor: pointer;
  border-radius: 4px;
}
.sl-item-body { min-width: 0; }
.sl-item-head { min-width: 0; gap: 8px; }
.sl-item-head-right { display: inline-flex; align-items: baseline; gap: 8px; flex-shrink: 0; }
.sl-item-from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-item:last-child { border-bottom: 0; }
.sl-item:hover { background: var(--surface-2); }
.sl-item[data-active="1"] .sl-item-bar { box-shadow: 0 0 0 3px rgba(182, 69, 53, 0.18); }

.sl-item-bar {
  border-radius: 2px;
  background: var(--status-red);  /* default; overridden per data-status below */
}
.sl-item[data-status="AWAITING YOUR REPLY"] .sl-item-bar { background: var(--status-red); }
.sl-item[data-status="BACKLOG"]             .sl-item-bar { background: var(--status-blue); }
.sl-item[data-status="IN PROGRESS"]         .sl-item-bar { background: var(--status-amber); }
.sl-item[data-status="WAITING"]             .sl-item-bar { background: var(--status-violet); }
.sl-item[data-status="DISCUSSION"]          .sl-item-bar { background: var(--status-teal); }
.sl-item[data-status="FYI"]                 .sl-item-bar { background: var(--ink-faint); }
.sl-item[data-status="DONE"]                .sl-item-bar { background: var(--status-green); }

.sl-item-head {
  display: flex; justify-content: space-between; align-items: baseline;
}
.sl-item-from {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--fs-sm);
  /* ink-muted (not full ink) so the sender label recedes — the task
     line is the primary read; from-name is supporting context. */
  color: var(--ink-muted);
}
.sl-item-time {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
/* Status chip — muted, small-caps feel. Tuned for baseline alignment
   next to sans "from" text and mono "time" without dominating the row. */
.sl-item-status {
  font-family: var(--font-sans);
  font-size: calc(var(--fs-xs) - 1px);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0 5px;
  border-radius: 2px;
  white-space: nowrap;
  color: var(--ink-faint);
  background: transparent;
  line-height: 1.5;
  flex-shrink: 0;
}
.sl-item[data-status="AWAITING YOUR REPLY"] .sl-item-status {
  color: var(--status-red);
  background: color-mix(in srgb, var(--status-red) 12%, transparent);
}
.sl-item[data-status="BACKLOG"] .sl-item-status {
  color: var(--status-blue);
  background: color-mix(in srgb, var(--status-blue) 12%, transparent);
}
.sl-item[data-status="IN PROGRESS"] .sl-item-status {
  color: var(--status-amber);
  background: color-mix(in srgb, var(--status-amber) 14%, transparent);
}
.sl-item[data-status="WAITING"] .sl-item-status {
  color: var(--status-violet);
  background: color-mix(in srgb, var(--status-violet) 12%, transparent);
}
.sl-item[data-status="DISCUSSION"] .sl-item-status {
  color: var(--status-teal);
  background: color-mix(in srgb, var(--status-teal) 12%, transparent);
}
.sl-item[data-status="FYI"] .sl-item-status {
  color: var(--ink-faint);
  background: var(--surface-2);
}
.sl-item[data-status="DONE"] .sl-item-status {
  color: var(--status-green);
  background: color-mix(in srgb, var(--status-green) 12%, transparent);
}
.sl-item-msg {
  /* Sans (system) for the task body — productivity-tool convention.
     Serif here read literary against the rest of the sans UI; family
     swap created visual noise without contributing to the hierarchy.
     Keep emphasis via size + weight + color (set per data-source). */
  font-family: var(--font-sans);
  /* fs-md (one notch up from fs-base) — message body is the primary
     read in a row; sizing it above the metadata row makes the task
     the visual anchor instead of the sender/timestamp strip. */
  font-size: var(--fs-md);
  color: var(--ink-muted);
  line-height: 1.45;
  letter-spacing: -0.005em;
  margin-top: 2px;
  overflow: hidden;
  white-space: normal;
  word-break: break-word;
}
/* Raw-preview cards (pre-v3 cache / inference failure) clamp to two
   lines — that's Slack text we don't want filling the card. Inference
   cards use their natural height so multi-action lists render in full. */
.sl-item-msg[data-source="raw"] {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
}
/* Single-action inference cards — same two-line clamp for visual
   parity with raw-preview. Multi-action lists render in full. */
.sl-item-msg[data-source="inference"]:not(:has(ol)) {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
}
.sl-item-actions {
  margin: 2px 0 0;
  padding-left: 20px;
  font-weight: 500;
}
.sl-item-actions li {
  margin: 2px 0;
  line-height: 1.45;
}
.sl-item-thread {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  margin-top: 3px;
}

/* v3 semantic inference — the card's primary line swaps from raw Slack
   text to an LLM-produced action statement. Inference text is what the
   user actually needs to read; bump it to full ink + weight 600 so it
   wins against the muted sender/timestamp/channel-head row. Raw-source
   fallbacks stay ink-muted (preview, not a confirmed task). */
.sl-item-msg[data-source="inference"] {
  color: var(--ink);
  font-weight: 600;
}
/* Multi-action lists inherit the parent's color/weight; explicit rule
   here so future readers see "yes, the <ol> items are also primary". */
.sl-item-actions li { color: var(--ink); font-weight: 600; }
.sl-item-msg[data-source="inference-empty"],
.sl-item-msg--muted { opacity: 0.55; }
.sl-item-msg-more { opacity: 0.65; font-size: 0.9em; margin-left: 0.25em; }

/* "What to do" block at top of the side panel — shows all actions
   (card only shows the first). Subtle accent tint so it reads as
   derived content, not a message. */
.sl-panel-actions-block {
  margin: 0 0 14px;
  padding: 10px 12px;
  border-left: 3px solid var(--accent, #4e8cff);
  background: var(--panel-accent-bg, rgba(78,140,255,0.07));
  border-radius: 6px;
}
.sl-panel-actions-head {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.7;
  margin-bottom: 6px;
}
.sl-panel-actions-list {
  margin: 0;
  padding-left: 18px;
}
.sl-panel-actions-list li {
  margin: 3px 0;
  line-height: 1.4;
}

/* ========================================================================
   Banner (stale cache, schema mismatch, fetch failed)
   ======================================================================== */
.sl-banner {
  padding: 10px 14px;
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--ink-muted);
  margin-bottom: 12px;
}
.sl-banner[data-severity="warn"] {
  border-color: var(--status-amber);
  color: var(--status-amber);
}

/* ========================================================================
   Empty states
   ======================================================================== */
.sl-empty {
  padding: 32px 20px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  border-radius: 8px;
  text-align: center;
  font-family: var(--font-sans);
  margin-top: 20px;
}
.sl-empty h4 {
  font-family: var(--font-serif);
  font-size: var(--fs-md);
  margin: 0 0 4px;
  color: var(--ink);
  font-weight: 500;
}
.sl-empty p { font-size: var(--fs-sm); color: var(--ink-muted); margin: 0; }
.sl-empty button {
  margin-top: 12px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  padding: 6px 14px;
  background: var(--ink);
  color: var(--surface);
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}

/* Done (derived) — collapsed, low-emphasis section below the columns. */
.sl-done { margin: 16px 0 0; }
.sl-done-head {
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  padding: 8px 0;
}
.sl-done-head .count {
  margin-left: 6px;
  opacity: 0.7;
}
.sl-done-inner { opacity: 0.7; }

/* ========================================================================
   Topbar
   ======================================================================== */
.sl-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--topbar-py) var(--topbar-px);
  margin-bottom: 14px;
  gap: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border-faint);
  border-radius: 10px;
}
.sl-topbar-left {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
}
.sl-brand {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: var(--fs-lg);
  letter-spacing: -0.015em;
  color: var(--ink);
}
.sl-topbar-right { display: flex; gap: 8px; align-items: center; }
.sl-fresh {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  padding-left: 12px;
  border-left: 1px solid var(--border);
}
.sl-fresh[data-stale="1"] { color: var(--status-amber); }
.sl-fresh[data-stale="2"] {
  color: var(--status-red);
  font-weight: 600;
}
.sl-fresh[data-stale="2"]::after {
  content: "— refresh slacklens";
  margin-left: 8px;
  color: var(--ink-muted);
  font-weight: 400;
}

.sl-iconbtn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--ink-muted);
  cursor: pointer;
  font-family: inherit;
}
.sl-iconbtn:hover { color: var(--ink); }

/* ========================================================================
   Toolbar — segmented, card-backed for visual cohesion with topbar
   ======================================================================== */
.sl-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: var(--topbar-py) var(--topbar-px);
  margin-bottom: 16px;
  flex-wrap: wrap;
  background: var(--surface-2);
  border: 1px solid var(--border-faint);
  border-radius: 10px;
}
/* Segmented group — wraps a set of pills in one tight rounded container */
.sl-pills {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  background: var(--surface);
  border: 1px solid var(--border-faint);
  border-radius: 999px;
  flex-wrap: wrap;
}
/* Dividers replaced by segmented groups; keep element but hide */
.sl-divider { display: none; }
.sl-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: var(--pill-py) var(--pill-px);
  border-radius: 999px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  background: transparent;
  border: 0;
  color: var(--ink-muted);
  cursor: pointer;
  transition: background 120ms, color 120ms;
}
.sl-pill:hover { color: var(--ink); }
.sl-pill .count {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.sl-pill.active {
  background: var(--surface-2);
  color: var(--ink);
  /* inset ring keeps the visible pill size identical at rest vs active —
     a non-inset 0 0 0 1px shadow grows the pill by 2px each side.
     Drop-shadow stays non-inset so the active pill still lifts off bg. */
  box-shadow: 0 1px 2px rgba(42, 40, 34, 0.08), inset 0 0 0 1px var(--border);
  /* font-weight intentionally unchanged — bolding on activate reflows the
     segmented group (wider glyphs push siblings). Contrast comes from
     bg + ring + color + ::before dot opacity bump. */
}
.sl-pill.active .count { color: var(--ink-muted); }

/* Color-coded leading dot per filter — signals which content tint a pill targets */
.sl-pill::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
  flex-shrink: 0;
}
.sl-pill[data-scope="all"]::before         { background: var(--ink-faint); }
.sl-pill[data-scope="needs_reply"]::before { background: var(--status-red); }
.sl-pill[data-scope="mentions"]::before    { background: var(--vip-red); }
.sl-pill[data-scope="dms"]::before         { background: var(--dm-accent); }
.sl-pill[data-scope="channels"]::before    { background: var(--chan-accent); }
.sl-pill[data-status="BACKLOG"]::before     { background: var(--status-blue); }
.sl-pill[data-status="IN PROGRESS"]::before { background: var(--status-amber); }
.sl-pill[data-status="WAITING"]::before     { background: var(--status-violet); }
.sl-pill[data-status="DISCUSSION"]::before  { background: var(--status-teal); }
.sl-pill[data-status="FYI"]::before         { background: var(--ink-faint); }
.sl-pill[data-status="DONE"]::before        { background: var(--status-green); }
.sl-pill.active::before { opacity: 1; }

.sl-search {
  flex: 1 1 200px; min-width: 160px; max-width: 280px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border-faint);
}
.sl-search .icon { color: var(--ink-faint); font-size: 13px; }
.sl-search input {
  flex: 1; border: 0; background: transparent; outline: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink);
}
.sl-search input::placeholder { color: var(--ink-faint); }

/* Density — same segmented pattern as pill groups for shape consistency */
.sl-density {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  background: var(--surface);
  border: 1px solid var(--border-faint);
  border-radius: 999px;
}
.sl-density-btn {
  border: 0;
  background: transparent;
  padding: var(--pill-py) var(--pill-px);
  border-radius: 999px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  cursor: pointer;
  transition: background 120ms, color 120ms;
}
.sl-density-btn:hover { color: var(--ink); }
.sl-density-btn.active {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(42, 40, 34, 0.08), inset 0 0 0 1px var(--border);
  /* same rationale as .sl-pill.active — avoid width reflow + outer-ring grow. */
}

.sl-toolbar-right {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.sl-switch {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  cursor: pointer;
  user-select: none;
}
.sl-switch input { display: none; }
.sl-switch .track {
  width: 26px; height: 14px;
  background: var(--border);
  border-radius: 999px;
  position: relative;
}
.sl-switch .track::after {
  content: "";
  position: absolute; top: 2px; left: 2px;
  width: 10px; height: 10px;
  background: var(--surface);
  border-radius: 50%;
  transition: transform 120ms;
}
.sl-switch input:checked + .track { background: var(--ink); }
.sl-switch input:checked + .track::after { transform: translateX(12px); }

/* Focus rings (accessibility) */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}

/* ========================================================================
   Side panel
   ======================================================================== */
.sl-panel-backdrop {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.15);
  z-index: 40;
}
.sl-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px; max-width: 100vw;
  background: var(--surface-2);
  border-left: 1px solid var(--border);
  z-index: 50;
  display: flex; flex-direction: column;
  box-shadow: -8px 0 24px rgba(0, 0, 0, 0.08);
}
@media (max-width: 899px) { .sl-panel { width: 100vw; } }

.sl-panel-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-faint);
}
.sl-panel-title {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
  color: var(--ink);
}
.sl-panel-meta {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-faint);
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  display: flex; justify-content: space-between; gap: 12px;
}
.sl-panel-meta .k { color: var(--ink-faint); margin-right: 6px; }

.sl-panel-actions {
  display: flex; gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-faint);
  flex-wrap: wrap;
}
.sl-btn {
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.sl-btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.sl-panel-thread { flex: 1; padding: 14px 16px; overflow-y: auto; }
.sl-panel-thread .msg { margin-bottom: 14px; }
.sl-panel-thread .msg-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
}
.sl-panel-thread .msg-from { font-weight: 600; color: var(--ink); }
.sl-panel-thread .msg-time { font-family: var(--font-mono); color: var(--ink-faint); }
.sl-panel-thread .msg-body {
  font-family: var(--font-serif);
  font-size: var(--fs-base);
  color: var(--ink-muted);
  line-height: 1.5;
  margin-top: 3px;
  white-space: pre-wrap;
}
.sl-panel-thread .msg.me .msg-from { color: var(--ink-faint); }

.sl-panel-note {
  padding: 12px 16px;
  border-top: 1px solid var(--border-faint);
  background: var(--surface);
}
.sl-note-label {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.sl-panel-note textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 42px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink);
  resize: vertical;
  outline: 0;
}
.sl-panel-note textarea:focus { border-color: var(--ink-muted); }

/* ========================================================================
   Item action tail — always-visible primary glyphs + ⋯ menu (click-reveal)
   ======================================================================== */
.sl-item-tail {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  align-self: center;
  flex-shrink: 0;
}

/* Always-visible primary glyphs (Slack jump, snooze) — plain icon at rest,
   subtle tint on hover. Accent color stays restrained. */
.sl-item-go {
  border: 0;
  background: transparent;
  color: var(--ink-faint);
  font-size: var(--action-fs);
  padding: var(--action-pad) calc(var(--action-pad) + 2px);
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  line-height: 1;
  transition: color 120ms, background 120ms;
}
.sl-item-go:hover { color: var(--ink); background: var(--surface-2); }
.sl-item-go.primary { color: var(--chan-accent); }
.sl-item-go.primary:hover {
  color: var(--surface);
  background: var(--chan-accent);
}
.sl-col--dms .sl-item-go.primary { color: var(--dm-accent); }
.sl-col--dms .sl-item-go.primary:hover {
  color: var(--surface);
  background: var(--dm-accent);
}

.sl-menu {
  position: absolute;
  z-index: 60;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  padding: 4px;
  min-width: 180px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
}
.sl-menu button {
  display: block; width: 100%;
  text-align: left;
  padding: 5px 10px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: inherit; font-size: inherit;
  border-radius: 4px;
  cursor: pointer;
}
.sl-menu button:hover { background: var(--surface-2); }

/* Snoozed visual treatment */
.sl-item[data-snoozed="1"] { opacity: 0.5; }
.sl-item[data-snoozed="1"] .sl-item-bar { position: relative; }
.sl-item[data-snoozed="1"] .sl-item-bar::after {
  content: "☾"; position: absolute; left: 3px; top: -10px;
  font-size: 9px; color: var(--ink-faint);
}

/* Keyboard-navigation focus on item rows */
.sl-item[data-kb-focus="1"] {
  background: var(--surface-2);
  outline: 2px solid var(--ink);
  outline-offset: -2px;
}
</style>
</head>
<body>
  <!-- Topbar: brand + freshness (left) · theme toggle + reload (right) -->
  <header class="sl-topbar">
    <div class="sl-topbar-left">
      <div class="sl-brand">SlackLens</div>
      <div id="freshness" class="sl-fresh">0 · loading…</div>
    </div>
    <div class="sl-topbar-right">
      <button id="themeToggle" class="sl-iconbtn" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <!-- Toolbar: category filters · status filters · search · density · snoozed -->
  <nav class="sl-toolbar" aria-label="Filters and controls">
    <div class="sl-pills" id="categoryPills" role="radiogroup" aria-label="Category filter">
      <button class="sl-pill active" data-scope="all"         type="button">All <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="needs_reply" type="button">Needs reply <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="mentions"    type="button">Mentions <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="dms"         type="button">DMs <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="channels"    type="button">Channels <span class="count">0</span></button>
    </div>
    <div class="sl-divider"></div>
    <div class="sl-pills" id="statusPills" aria-label="Status filter">
      <button class="sl-pill" data-status="BACKLOG"     type="button">Backlog <span class="count">0</span></button>
      <button class="sl-pill" data-status="IN PROGRESS" type="button">In progress <span class="count">0</span></button>
      <button class="sl-pill" data-status="WAITING"     type="button">Waiting <span class="count">0</span></button>
      <button class="sl-pill" data-status="DISCUSSION"  type="button">Discussion <span class="count">0</span></button>
      <button class="sl-pill" data-status="FYI"         type="button">FYI <span class="count">0</span></button>
      <button class="sl-pill" data-status="DONE"        type="button">Done <span class="count">0</span></button>
    </div>
    <div class="sl-divider"></div>
    <label class="sl-search">
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="text" placeholder="Search channel, person, text…" />
    </label>
    <div class="sl-toolbar-right">
      <div class="sl-density" role="radiogroup" aria-label="Density">
        <button class="sl-density-btn" data-density="compact"  type="button">Compact</button>
        <button class="sl-density-btn active" data-density="balanced" type="button">Balanced</button>
        <button class="sl-density-btn" data-density="spacious" type="button">Spacious</button>
      </div>
    </div>
  </nav>

  <!-- Banner: stale cache / schema mismatch / fetch-failed -->
  <div id="banner" class="sl-banner" hidden></div>

  <!-- Triage layout:
         1. VIP band (full-width, top) — mentions/DMs/channels tagged VIP
         2. Two-column grid below:
              • left  = channels + group DMs (higher signal, don't lose)
              • right = 1:1 DMs -->
  <main id="channelFlow" class="sl-flow" aria-label="Triage">
    <section id="vipBand" class="sl-vip-band" aria-label="High priority" hidden>
      <div id="vipBandInner" class="sl-vip-band-inner"></div>
    </section>
    <div class="sl-grid-2col">
      <section id="leftCol"  class="sl-col sl-col--channels" aria-label="Channels and group DMs"></section>
      <section id="rightCol" class="sl-col sl-col--dms"      aria-label="Direct messages"></section>
    </div>
  </main>

  <!-- Waiting on others: open threads where the ball is in someone else's
       court (incl. vendor/oversight work the user tracks but does not own).
       Collapsed by default; subordinate to the main board. -->
  <section id="waitingSection" class="sl-waiting" aria-label="Waiting on others" hidden>
    <button id="waitingToggle" class="sl-done-head" type="button" aria-expanded="false">
      Waiting on others <span id="waitingCount" class="count">0</span>
    </button>
    <div id="waitingInner" class="sl-done-inner" hidden></div>
  </section>

  <!-- Done (derived): tasks the inference concluded are finished. Collapsed
       by default; recent-only (drops out when the thread ages past 48h). -->
  <section id="doneSection" class="sl-done" aria-label="Done (derived)" hidden>
    <button id="doneToggle" class="sl-done-head" type="button" aria-expanded="false">
      Done (derived) <span id="doneCount" class="count">0</span>
    </button>
    <div id="doneInner" class="sl-done-inner" hidden></div>
  </section>

  <!-- Unknown footer: threads inference couldn't read. Counted, never
       fabricated onto the board as a fake task. -->
  <div id="unknownFooter" class="sl-unknown-footer" hidden></div>

  <!-- Empty state container (shown when nothing renders) -->
  <div id="emptyState" class="sl-empty" hidden></div>

  <footer class="sl-footer">
    <span>SlackLens · data: <code>~/.slacklens/cache.json</code></span>
  </footer>

  <!-- Side panel (BELOW all interactive content, ABOVE the script tag) -->
  <aside id="sidePanel" class="sl-panel" hidden aria-label="Thread detail">
    <div class="sl-panel-head">
      <div class="sl-panel-title">
        <span id="panelChannel"></span>
      </div>
      <button id="panelClose" class="sl-iconbtn" type="button" aria-label="Close panel">✕</button>
    </div>
    <div class="sl-panel-meta">
      <div><span class="k">Channel</span><span id="panelChannelType"></span></div>
      <div><span class="k">Status</span><span id="panelStatus"></span></div>
    </div>
    <div class="sl-panel-actions">
      <button id="actOpen"    class="sl-btn primary" type="button">↗ Open in Slack</button>
      <button id="actCopy"    class="sl-btn" type="button">⎘ Copy permalink</button>
    </div>
    <div id="panelThread" class="sl-panel-thread"></div>
  </aside>
  <div id="panelBackdrop" class="sl-panel-backdrop" hidden></div>

<script>
// ---------- Inlined cache (works under file://) ----------
// The cache-blob sentinel on the line AFTER the assignment below is
// load-bearing. Do not remove it. Refresh/setup use it as the regex
// terminator so a user message containing the JS closing-brace pair
// cannot end the non-greedy match early. (This comment intentionally
// avoids naming the assignment's identifier or the sentinel text so
// that the regex does not match inside the comment itself.)
window.__SLACK_CACHE__ = {
  "refreshed_at": null,
  "search_results": { "mentions": [], "dms": [], "channels": [] },
  "threads": {}
};
// __SLACK_CACHE_END__

// ---------- State ----------
const STATUSES = ['AWAITING YOUR REPLY','BACKLOG','IN PROGRESS','WAITING','DISCUSSION','FYI','DONE','UNKNOWN'];
const STATUS_LABELS = {
  'AWAITING YOUR REPLY': 'Needs reply',
  'BACKLOG': 'Backlog',
  'IN PROGRESS': 'In progress',
  'WAITING': 'Waiting',
  'DISCUSSION': 'Discussion',
  'FYI': 'FYI',
  'DONE': 'Done',
  'UNKNOWN': 'Unread by triage',
};
// Inference-era (v3 cache) statuses → existing pill enum. Lets the
// LLM own status inference without breaking pre-v3 caches that still
// carry the regex-inferred English strings above.
const STATUS_FROM_INFERENCE = {
  'AWAITING_REPLY':  'AWAITING YOUR REPLY',
  'BACKLOG':         'BACKLOG',
  'IN_PROGRESS':     'IN PROGRESS',
  'WAITING_ON_THEM': 'WAITING',
  'DONE':            'DONE',
  'DISCUSSION':      'DISCUSSION',
  'FYI':             'FYI',
};
const ME_ID = '';
const ME_NAME = '';
const VIP_IDS = [];  // VIPs (filled by slacklens-setup)
const VIP_NAMES = [];

let raw = null;       // parsed cache JSON
let items = [];       // normalized list
let filter = { scope:'all', status:[], query:'' };
// Workspace origin (e.g. 'https://example.slack.com'), derived from the
// first permalink we see in the cache. Falls back to slack.com so the
// link-out still resolves to Slack's router for unknown workspaces.
let WORKSPACE_ORIGIN = 'https://slack.com';

// ---------- Loading ----------
function clearBanner() {
  const b = document.getElementById('banner');
  if (!b) return;
  b.hidden = true;
  b.removeAttribute('data-severity');
  b.textContent = '';
}
function showBanner(severity, text) {
  const b = document.getElementById('banner');
  if (!b) return;
  b.hidden = false;
  b.dataset.severity = severity;
  b.textContent = text;
}
function checkSchemaBanner() {
  if (!raw || !raw.search_results) return;
  const sr = raw.search_results;
  const hasOldKeys = ('dms_received' in sr) || ('outgoing_dms' in sr);
  const hasNewKeys = ('mentions' in sr) && ('dms' in sr) && ('channels' in sr);
  if (hasOldKeys && !hasNewKeys) {
    showBanner('warn', 'Your cache predates v0.2.0 — run "refresh slacklens" to rebuild.');
    return;
  }
  // Soft upgrade prompt for older caches. Everything still works; the
  // dashboard degrades gracefully — v2+ tier scoring falls back to
  // regex-deriving from_user_id + mentioned_ids, and v3 inference
  // is the only version that skips raw-text previews in favor of
  // LLM-produced action statements.
  const ver = raw.version || 1;
  if (ver < 3) {
    showBanner('info', 'Run "refresh slacklens" to enable semantic task inference — cards will show what you need to do instead of raw Slack messages.');
  }
}

// --- v2 cache-compat helpers. --------------------------------------
// Dashboards shipped with v0.9.0+ prefer the structured fields written
// by slacklens-refresh (`from_user_id`, `mentioned_ids`, `reply_count`).
// Pre-v2 caches don't have them — we derive on the fly, identical regex
// to the one the refresh skill uses at write-time. Keep the two regexes
// in sync: if the ID format Slack uses ever changes, both sides break
// together and the fix is obvious. Leaving one side stale would look
// like a VIP-detection bug with no trail to the actual cause.
const ID_IN_NAME_RE      = /\(([UC][A-Z0-9]+)\)\s*$/;
const MENTION_IN_TEXT_RE = /<@([UC][A-Z0-9]+)>/g;

function deriveUserId(fromStr) {
  if (!fromStr) return '';
  const m = ID_IN_NAME_RE.exec(fromStr);
  return m ? m[1] : '';
}
function deriveMentions(text) {
  if (!text) return [];

// Parse the cache embedded in this file and render. The dashboard ships as
// a self-contained file:// artifact; fresh Slack data requires running the
// `slacklens-refresh` skill, which rewrites the embedded blob in place.
// A browser refresh then re-reads the file and re-runs this function.
function loadCache() {
  clearBanner();

    raw = window.__SLACK_CACHE__;
    normalize();
    checkSchemaBanner();
    render();
    return;
  }
  showBanner('warn', 'No cache data available.');
  const f = document.getElementById('freshness');
  if (f) f.textContent = 'No cache loaded.';
}

// Normalize mentions + threads into a single item list
function normalize() {
  items = [];
  const seen = new Set();
  deriveWorkspaceOrigin();

  // Build dedupe sets for bucket→thread collision. Two reasons strings
  // don't match cleanly:
  //   (a) Slack permalinks from search-bucket results often carry
  //       ?thread_ts=... query params; the same message fetched via
  //       slack_read_thread returns a bare permalink. Same message,
  //       different strings.
  //   (b) Some MCP runs return permalinks with trailing slashes or
  //       case-variant hosts.
  // So we build BOTH a permalink set and a (channel_id, ts) tuple set.
  // A bucket mention is "already represented by a thread" iff either
  // set matches. This covers the thread-parent-also-in-mentions case
  // that would otherwise double-render an inferred thread card AND a
  // standalone raw-text card for the same Slack message.
  const threadPermalinks = new Set();
  const threadMsgKeys    = new Set();   // "<channel_id>:<ts>"
  Object.values(raw.threads || {}).forEach(t => {
    const cid = t && t.channel_id || '';
    (t.messages || []).forEach(msg => {
      if (msg.permalink) threadPermalinks.add(msg.permalink);
      if (msg.ts) threadMsgKeys.add(cid + ':' + msg.ts);
    });
  });

  // 1) Threads (richer — have message history)
  const threads = raw.threads || {};
  Object.entries(threads).forEach(([threadKey, t]) => {
    if (!t || !t.channel_id) return;
    const msgs = (t.messages || []).slice().sort((a,b) => (+a.ts||0) - (+b.ts||0));
    const last = msgs[msgs.length - 1];
    const firstNonMe = msgs.find(m => !isMe(m.from));
    const permalink = deriveThreadPermalink(t, last || firstNonMe);
    const key = permalink || (t.channel_id + '/' + (t.thread_ts || 'top'));
    if (seen.has(key)) return; seen.add(key);

    const lastFrom = last ? cleanName(last.from) : '';
    const lastIsMe = last ? isMe(last.from) : false;
    const lastText = last ? last.text : '';
    const lastTime = last ? last.time : '';
    // Slack `ts` is a numeric epoch string — reliable for sorting regardless
    // of the timezone suffix on `last_time` ("IST", "PST" etc).
    const lastTs   = last ? (+last.ts || 0) : 0;

    // v3 cache carries an LLM-produced inference per thread. When present,
    // it wins over the regex `inferStatus` heuristic — the LLM can read
    // the whole thread (incl. Hinglish) and decide status on semantic
    // grounds. Absent inference → fall back to regex (pre-v3 caches).
    let derived;
    let inferenceActions = null;
    const inf = t.inference;
    if (inf && typeof inf === 'object'
        && Array.isArray(inf.actions)
        && STATUS_FROM_INFERENCE[inf.status]) {
      const mappedStatus = STATUS_FROM_INFERENCE[inf.status];
      derived = {
        status: mappedStatus,
        needs_reply: !!inf.needs_action && mappedStatus === 'AWAITING YOUR REPLY',
      };
      inferenceActions = inf.actions;
    } else {
      // No LLM inference for this thread (pre-v3 cache or skipped). Do NOT
      // fabricate a needs-reply with the regex heuristic — that floods the
      // board with false tasks (B10). Mark neutral; a refresh will infer it.
      derived = { status: 'UNKNOWN', needs_reply: false };
    }

    // vip_tagged_me: did any VIP send a message in this thread that tags
    // my Slack ID? That's the P0 signal — VIP actively addressing me as
    // opposed to being just present. Checked per-message because we need
    // to pair "sender is VIP" with "this same message tagged me"; the
    // union field `mentioned_ids_all` can't carry that pairing.
    let vipTaggedMe = false;
    for (const msg of msgs) {
      const senderId = msgUserId(msg);
      if (!senderId || !VIP_IDS.includes(senderId)) continue;
      if (msgMentions(msg).includes(ME_ID)) { vipTaggedMe = true; break; }
    }

    // stale_ping: I was tagged somewhere in this thread, but the
    // conversation moved on without me — >=2 messages from other people
    // arrived after my tag, and none of them were mine. That's the
    // "panic opens Slack, oh someone else already handled it" case.
    // When true we flip the inferred status to WAITING so it doesn't
    // occupy mental space as an open ask, and score drops accordingly
    // (WAITING doesn't get the needs_reply recency boost from overrides).
    let stalePing = false;
    const tagIdx = msgs.findIndex(msg => msgMentions(msg).includes(ME_ID));
    if (tagIdx !== -1) {
      let laterOther = 0;
      for (let i = tagIdx + 1; i < msgs.length; i++) {
        if (!isMe(msgs[i].from)) laterOther++;
        if (isMe(msgs[i].from)) { laterOther = 0; break; }  // I responded → not stale
      }
      if (laterOther >= 2) stalePing = true;
    }
    if (stalePing) {
      derived.status = 'WAITING';
      derived.needs_reply = false;
    }

    items.push({
      key,
      kind: kindFromChannel(t.channel_name, t.channel_id),
      channel_id: t.channel_id,
      channel_name: t.channel_name,
      channel_display: prettyChannel(t.channel_name, t.channel_id),
      permalink,
      last_from: lastFrom,
      last_is_me: lastIsMe,
      last_text: lastText,
      last_time: lastTime,
      last_ts: lastTs,
      msg_count: msgs.length,
      reply_count: threadReplyCount(t),
      participants: Array.from(new Set(msgs.map(m => cleanName(m.from)))).filter(Boolean),
      // Structured IDs for tier scoring — cheap to attach now so every
      // downstream check (isMe / isVIP / was-I-tagged) reads an array,
      // not a display string.
      participant_ids: Array.from(new Set(msgs.map(msgUserId))).filter(Boolean),
      last_from_id: last ? msgUserId(last) : '',
      mentioned_ids_all: Array.from(new Set(msgs.flatMap(msgMentions))).filter(Boolean),
      is_mention: Array.from(new Set(msgs.flatMap(msgMentions))).includes(ME_ID),
      vip_tagged_me: vipTaggedMe,
      stale_ping: stalePing,
      status: derived.status,
      needs_reply: derived.needs_reply,
      inference_actions: inferenceActions,   // v3: array or null
      source: 'thread',
    });
  });

  // 2) Search buckets (mentions + channels + dms) — add as items if not
  //    already covered by a thread.
  //
  //    Previously only the `mentions` bucket was rendered here. The
  //    `channels` and `dms` buckets were used ONLY to seed thread
  //    discovery in the refresh skill, so any unique result that
  //    didn't resolve into a fetched thread was invisible on the
  //    dashboard even though it sat in the cache. Iterating all three
  //    here, with a permalink-based dedupe, fixes that silent-loss
  //    class and gives outgoing-DMs / top-level channel pings a home.
  const sr = raw.search_results || {};
  const allQueries = [
    ...(sr.mentions || []),
    ...(sr.channels || []),
    ...(sr.dms      || []),
  ];
  allQueries.forEach(q => (q.results || []).forEach(m => {
    if (!m.permalink) return;
    if (threadPermalinks.has(m.permalink)) return;
    // Channel+ts dedupe — catches the common case where a thread-parent
    // message appears both inside the thread (via slack_read_thread)
    // and in the channels bucket (via slack_search), with slightly
    // different permalink forms.
    if (threadMsgKeys.has((m.channel_id || '') + ':' + (m.message_ts || ''))) return;
    if (seen.has(m.permalink)) return; seen.add(m.permalink);
    const lastIsMe   = isMe(m.from_user);
    const senderId   = resultUserId(m);
    const mentioned  = resultMentions(m);
    // Same P0 signal as for thread items, but here we have exactly one
    // message, so the pair-check is trivial: is the sender VIP AND does
    // that message tag me?
    const vipTaggedMe = Boolean(senderId && VIP_IDS.includes(senderId) && mentioned.includes(ME_ID));
    // Per-result inference (set by refresh skill when a bucket mention
    // has no matching cached thread). Overrides the default
    // AWAITING-YOUR-REPLY status so passive mentions (thank-yous, FYI
    // updates, cc-only pings) don't masquerade as needs-reply.
    const searchInf = m.inference;
    let searchStatus, searchNeedsReply, searchActions;
    if (searchInf && typeof searchInf === 'object'
        && Array.isArray(searchInf.actions)
        && STATUS_FROM_INFERENCE[searchInf.status]) {
      searchStatus = STATUS_FROM_INFERENCE[searchInf.status];
      searchNeedsReply = searchStatus === 'AWAITING YOUR REPLY';
      searchActions = searchInf.actions;
    } else {
      // No inference for this orphan bucket mention → neutral UNKNOWN, never
      // a fabricated needs-reply/waiting task (spec §6). Routes to the footer,
      // matching how inference-less threads are handled.
      searchStatus = 'UNKNOWN';
      searchNeedsReply = false;
      searchActions = null;
    }
    items.push({
      key: m.permalink,
      kind: kindFromChannel(m.channel_name, m.channel_id),
      channel_id: m.channel_id,
      channel_name: m.channel_name,
      channel_display: prettyChannel(m.channel_name, m.channel_id),
      permalink: m.permalink,
      last_from: cleanName(m.from_user),
      last_is_me: lastIsMe,
      last_text: m.text,
      last_time: m.time,
      last_ts: +m.message_ts || 0,
      msg_count: 1,
      reply_count: null,
      participants: [cleanName(m.from_user)].filter(Boolean),
      participant_ids: senderId ? [senderId] : [],
      last_from_id: senderId,
      mentioned_ids_all: mentioned,
      is_mention: mentioned.includes(ME_ID),
      vip_tagged_me: vipTaggedMe,
      stale_ping: false,
      status: searchStatus,
      needs_reply: searchNeedsReply,
      inference_actions: searchActions,
      source: 'search',
    });
  }));

  items.forEach(it => {
    it.channel_key = it.channel_id;
    it.tier = inferTier(it);
    // channel_is_vip now reflects "VIP anywhere in conversation" (P0 or P1).
    // Partitioning still treats this as "goes to VIP band"; tier-aware
    // ordering inside the band comes from the score-based sort below.
    it.channel_is_vip = it.tier === 'P0' || it.tier === 'P1';
    it.score = computeScore(it);
  });

  // Sort by composite score desc — tier dominates (P0=1000, P1=500,
  // P2=250, P3=100); recency (0-99) breaks ties within a tier.
  // DONE/snoozed items carry a -2000 penalty (see computeScore) so they
  // always sink to the bottom regardless of tier.
  items.sort((a, b) => (b.score || 0) - (a.score || 0) || (b.last_ts || 0) - (a.last_ts || 0));
}

// === Priority tiers ====================================================
// P0 (1000): VIP actively addresses me — DM from VIP, or VIP tagged me
//            in a channel/thread. Explicit ball-in-my-court signal.
// P1  (500): VIP passively present — in the conversation (posted or CC'd)
//            but didn't directly tag me.
// P2  (250): Normal channel/thread mention without any VIP involvement.
// P3  (100): Normal 1:1 DM with no VIP.
const TIER_BASE = { P0: 1000, P1: 500, P2: 250, P3: 100 };

function inferTier(it) {
  const myId   = ME_ID || '';

  // P0 — active address:
  //   (a) flag set at normalize time: some VIP's own message tagged me.
  //   (b) 1:1 DM and the other party is a VIP (structured IDs path).
  //   (c) Fallback for pre-v2 caches with no participant_ids: name-based
  //       VIP check on a 1:1 DM channel_display.
  if (it.vip_tagged_me) return 'P0';
  const is1on1Dm = it.kind === 'dm' && !isGroupDM(it.channel_name);
  if (is1on1Dm) {
    const others = (it.participant_ids || []).filter(id => id && id !== myId);
    if (others.some(id => vipIds.includes(id))) return 'P0';
    // v1-cache fallback: channel_display is "@Name" on DMs and the
    // DM-only match survived T1d's false-positive fix.
    if (others.length === 0 && isVIP(it.channel_display)) return 'P0';
  }

  // P1 — VIP anywhere in the conversation but not the direct addresser.
  if (isVIPAnywhere(it)) return 'P1';

  // P2 / P3 split by surface: DM channels default to P3, everything
  // else (public/private channels + group DMs) is P2.
  return is1on1Dm ? 'P3' : 'P2';

function isVIPAnywhere(it) {
  const vipIds = VIP_IDS || [];
  const pIds   = it.participant_ids   || [];
  const mIds   = it.mentioned_ids_all || [];
  if (pIds.some(id => vipIds.includes(id))) return true;
  if (mIds.some(id => vipIds.includes(id))) return true;
  // v1-cache fallback: name-based participant check.
  if (isVIP(it.last_from)) return true;
  if (it.participants && it.participants.some(p => isVIP(p))) return true;
  return false;

function computeScore(it) {
  const base = TIER_BASE[it.tier] || 0;
  // Recency: 0..99. Items from "now" get 99, ~48h old get ~3, older get 0.
  // Slope of 2 pts/hour keeps tier buckets clearly separated — a 5h-old
  // P0 (1000+89) still outranks a fresh P1 (500+99).
  const ageH = Math.max(0, (Date.now() / 1000 - (it.last_ts || 0)) / 3600);
  const recency = Math.max(0, 99 - ageH * 2);
  // DONE and FYI sink below every tier so they can't bubble up by recency —
  // FYI is "passively CC'd, no action implied", attention-wise equivalent to
  // resolved. (These items also move to the Done(derived) section.)
  const penalty = (it.status === 'DONE' || it.status === 'FYI') ? -2000 : 0;
  return base + recency + penalty;
}

// Escape a string so it can be embedded safely in a RegExp source.

// Names must be word-bounded: plain substring match would let "Ann" hit
// "Annie" and promote unrelated threads into the VIP band, and let a user
// "Sam" match every message from "Samantha". `\b` is ASCII-only in JS, which
// is good enough for the English-Latin Slack names we see in practice.

  return new RegExp('\\b' + reEscape(name) + '\\b', 'i').test(s);

  // the whole channel got flagged VIP whenever "alice" was a VIP, even

// <url|label>, <!here> etc. Users see the raw tokens in the dashboard

    .replace(/<#([A-Z0-9]+)\|([^>]+)>/g, (_, _id, name) => '#' + name)
    .replace(/<#([A-Z0-9]+)>/g,            (_, id)       => '#' + id)
    .replace(/<(https?:\/\/[^|>]+)\|([^>]+)>/g, (_, _u, label) => label)

    .replace(/<!(here|channel|everyone)(?:\|[^>]*)?>/g, (_, w) => '@' + w)
    .replace(/<!subteam\^[A-Z0-9]+(?:\|([^>]+))?>/g, (_, name) => name ? '@' + name : '@group')

  const buckets = [sr.mentions, sr.dms, sr.channels, Object.values(raw && raw.threads || {})];

    if (!bucket) continue;
    for (const entry of bucket) {
      const results = entry && (entry.results || entry.messages);
      if (!results) continue;
      for (const r of results) {
        if (r && typeof r.permalink === 'string' && r.permalink.startsWith('http')) {
