<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slack Triage — Live</title>
<style>
/* ========================================================================
   Design tokens — applied via :root (light default) + data-theme="dark"
   Densities via data-density="compact|balanced|spacious" (default balanced)
   See docs/superpowers/specs/2026-04-22-slacklens-dashboard-redesign-design.md
   ======================================================================== */
:root {
  /* Typography families */
  --font-serif: "Iowan Old Style", "Palatino", "Hoefler Text", Georgia, serif;
  --font-sans:  -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-mono:  "SF Mono", "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* Font sizes — Balanced defaults; overridden per density below */
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-base: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;

  /* Spacing tokens — Balanced defaults; overridden per density below */
  --item-py: 6px;
  --item-gap: 4px;
  --channel-mb: 16px;
  --col-gap: 20px;
  --frame-pad: 24px;
  --chanhead-py: 6px;

  /* Colors — light theme (default) */
  --surface: #faf9f4;
  --surface-2: #fefdf8;
  --border: #e8e5d9;
  --border-faint: #eeeadd;
  --ink: #2a2822;
  --ink-muted: #5a5648;
  --ink-faint: #908b78;
  --vip-red: #b64535;
  --status-red: #b64535;
  --status-amber: #b8821f;
  --status-gray: #d6d0bd;
  --status-green: #5a7f5a;

  /* Column tints — subtle accents for the Channels vs DMs split.
     Accent = visible left-border; bg = ~5% alpha wash behind the card. */
  --chan-accent: #5a7f8a;   /* cool teal-slate — channel threads */
  --chan-bg:     #f3f1e8;   /* slightly cooler than surface */
  --dm-accent:   #a87b5a;   /* warm sienna — 1:1 DMs */
  --dm-bg:       #f8f3e7;   /* slightly warmer than surface */
  --vip-band-bg: #f9eeea;   /* faint warm-red wash behind VIP band */

  /* Misc */
  --stale-cache-hours: 12;  /* freshness meta turns amber past this */
  --transition-theme: 150ms ease;
}

:root[data-density="compact"] {
  --fs-xs: 10px;  --fs-sm: 11px;  --fs-base: 12px;  --fs-md: 13px;  --fs-lg: 15px;
  --item-py: 4px;  --item-gap: 2px;  --channel-mb: 12px;
  --col-gap: 16px;  --frame-pad: 20px;  --chanhead-py: 4px;
}
:root[data-density="spacious"] {
  --fs-xs: 12px;  --fs-sm: 13px;  --fs-base: 14px;  --fs-md: 15px;  --fs-lg: 17px;
  --item-py: 10px;  --item-gap: 6px;  --channel-mb: 24px;
  --col-gap: 24px;  --frame-pad: 32px;  --chanhead-py: 8px;
}

:root[data-theme="dark"] {
  --surface: #1a1814;
  --surface-2: #22201b;
  --border: #2e2b24;
  --border-faint: #262420;
  --ink: #ede8d6;
  --ink-muted: #b0a991;
  --ink-faint: #8a8270;
  --vip-red: #e87b68;
  --status-red: #e87b68;
  --status-amber: #d4a33a;
  --status-gray: #4a4539;
  --status-green: #7ea97e;
  --chan-accent: #6a9aa5;
  --chan-bg:     #1e1f1d;
  --dm-accent:   #c79a74;
  --dm-bg:       #221e19;
  --vip-band-bg: #2a201d;
}

/* Follow OS default when no explicit theme is set */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --surface: #1a1814; --surface-2: #22201b; --border: #2e2b24; --border-faint: #262420;
    --ink: #ede8d6; --ink-muted: #b0a991; --ink-faint: #8a8270;
    --vip-red: #e87b68; --status-red: #e87b68; --status-amber: #d4a33a;
    --status-gray: #4a4539; --status-green: #7ea97e;
    --chan-accent: #6a9aa5; --chan-bg: #1e1f1d;
    --dm-accent: #c79a74;   --dm-bg: #221e19;
    --vip-band-bg: #2a201d;
  }
}

/* ========================================================================
   Global + layout
   ======================================================================== */
html { background: var(--surface); color: var(--ink); transition: background-color var(--transition-theme), color var(--transition-theme); }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.4;
  margin: 0;
  padding: var(--frame-pad);
  max-width: 1800px;
  margin-inline: auto;
  color: var(--ink);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }

/* Make [hidden] actually hide elements whose class rules set an explicit
   display (.sl-panel uses flex — without this, hidden gets overridden by
   class specificity and the element stays visible). This is the canonical
   fix for the "panel won't close" footgun. */
[hidden] { display: none !important; }

.sl-flow {
  margin-top: 20px;
}

/* VIP band — full-width, always on top, warm accent */
.sl-vip-band {
  position: relative;
  background: var(--vip-band-bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--vip-red);
  border-radius: 6px;
  padding: 10px 14px 12px;
  margin-bottom: 20px;
}
.sl-vip-band::before {
  content: "★ HIGH PRIORITY";
  display: block;
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--vip-red);
  margin-bottom: 8px;
}
/* Inside the band, render channel cards in a 2-col masonry so dense VIP
   activity still fits above the fold. */
@media (min-width: 1024px) {
  .sl-vip-band-inner { columns: 2; column-gap: var(--col-gap); }
  .sl-vip-band-inner .sl-channel { break-inside: avoid; display: block; }
}

/* Two-column split: left = channels + group DMs, right = 1:1 DMs */
.sl-grid-2col {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--col-gap);
}
@media (min-width: 1024px) {
  .sl-grid-2col {
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  }
}
.sl-col { min-width: 0; }
.sl-col::before {
  display: block;
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-faint);
}
.sl-col--channels::before { content: "# CHANNELS"; color: var(--chan-accent); }
.sl-col--dms::before      { content: "@ DIRECT MESSAGES"; color: var(--dm-accent); }
.sl-col:empty { display: none; }

/* Per-column channel card tint */
.sl-col--channels .sl-channel {
  border-left: 2px solid var(--chan-accent);
  background: var(--chan-bg);
  padding: 8px 12px;
  border-radius: 4px;
}
.sl-col--dms .sl-channel {
  border-left: 2px solid var(--dm-accent);
  background: var(--dm-bg);
  padding: 8px 12px;
  border-radius: 4px;
}
.sl-vip-band .sl-channel {
  background: transparent;
  padding: 6px 8px;
}

.sl-footer {
  margin-top: 32px;
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  text-align: right;
}
.sl-footer code { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }

/* ========================================================================
   Channel header
   ======================================================================== */
.sl-channel { margin-bottom: var(--channel-mb); }
.sl-channel-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: var(--chanhead-py) 0;
  border-bottom: 1px solid var(--border-faint);
  margin-bottom: var(--item-gap);
}
.sl-channel-name {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--fs-md);
  letter-spacing: -0.01em;
  color: var(--ink);
  max-width: calc(100% - 100px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sl-channel-meta {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ========================================================================
   Item row
   ======================================================================== */
.sl-item {
  position: relative;
  display: grid;
  /* minmax(0, 1fr) lets the body column shrink below its content width;
     otherwise long messages blow out the row and ignore text-overflow. */
  grid-template-columns: 2px minmax(0, 1fr);
  gap: 10px;
  padding: var(--item-py) 6px var(--item-py) 0;
  border-bottom: 1px solid var(--border-faint);
  cursor: pointer;
  border-radius: 4px;
}
.sl-item-body { min-width: 0; }
.sl-item-head { min-width: 0; gap: 8px; }
.sl-item-from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-item:last-child { border-bottom: 0; }
.sl-item:hover { background: var(--surface-2); }
.sl-item[data-active="1"] .sl-item-bar { box-shadow: 0 0 0 3px rgba(182, 69, 53, 0.18); }

.sl-item-bar {
  border-radius: 2px;
  background: var(--status-red);  /* default; overridden per data-status below */
}
.sl-item[data-status="AWAITING YOUR REPLY"] .sl-item-bar { background: var(--status-red); }
.sl-item[data-status="IN PROGRESS"]         .sl-item-bar { background: var(--status-amber); }
.sl-item[data-status="DISCUSSION"]          .sl-item-bar { background: var(--status-amber); }
.sl-item[data-status="WAITING"]             .sl-item-bar { background: var(--status-gray); }
.sl-item[data-status="BACKLOG"]             .sl-item-bar { background: var(--status-gray); }
.sl-item[data-status="DONE"]                .sl-item-bar { background: var(--status-green); }

.sl-item-head {
  display: flex; justify-content: space-between; align-items: baseline;
}
.sl-item-from {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--fs-sm);
  color: var(--ink);
}
.sl-item-time {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.sl-item-msg {
  font-family: var(--font-serif);
  font-size: var(--fs-base);
  color: var(--ink-muted);
  line-height: 1.4;
  margin-top: 2px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.sl-item-thread {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  margin-top: 3px;
}

/* ========================================================================
   Banner (stale cache, schema mismatch, fetch failed)
   ======================================================================== */
.sl-banner {
  padding: 10px 14px;
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--ink-muted);
  margin-bottom: 12px;
}
.sl-banner[data-severity="warn"] {
  border-color: var(--status-amber);
  color: var(--status-amber);
}

/* ========================================================================
   Empty states
   ======================================================================== */
.sl-empty {
  padding: 32px 20px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  border-radius: 8px;
  text-align: center;
  font-family: var(--font-sans);
  margin-top: 20px;
}
.sl-empty h4 {
  font-family: var(--font-serif);
  font-size: var(--fs-md);
  margin: 0 0 4px;
  color: var(--ink);
  font-weight: 500;
}
.sl-empty p { font-size: var(--fs-sm); color: var(--ink-muted); margin: 0; }
.sl-empty button {
  margin-top: 12px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  padding: 6px 14px;
  background: var(--ink);
  color: var(--surface);
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}

/* ========================================================================
   Topbar
   ======================================================================== */
.sl-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0 12px;
  border-bottom: 1px solid var(--border-faint);
  margin-bottom: 12px;
}
.sl-brand {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
  color: var(--ink);
}
.sl-topbar-right { display: flex; gap: 14px; align-items: center; }
.sl-fresh {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.sl-fresh[data-stale="1"] { color: var(--status-amber); }
.sl-fresh[data-stale="2"] {
  color: var(--status-red);
  font-weight: 600;
}
.sl-fresh[data-stale="2"]::after {
  content: "— refresh slacklens";
  margin-left: 8px;
  color: var(--ink-muted);
  font-weight: 400;
}

.sl-iconbtn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--ink-muted);
  cursor: pointer;
  font-family: inherit;
}
.sl-iconbtn:hover { color: var(--ink); }

/* ========================================================================
   Toolbar
   ======================================================================== */
.sl-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 4px;
  flex-wrap: wrap;
}
.sl-pills { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.sl-divider { width: 1px; height: 20px; background: var(--border); }
.sl-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  background: var(--surface-2);
  border: 1px solid var(--border-faint);
  color: var(--ink-muted);
  cursor: pointer;
}
.sl-pill .count {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.sl-pill.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.sl-pill.active .count { color: var(--surface); opacity: 0.7; }

.sl-search {
  flex: 1 1 220px; min-width: 180px; max-width: 320px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border-faint);
}
.sl-search .icon { color: var(--ink-faint); font-size: 13px; }
.sl-search input {
  flex: 1; border: 0; background: transparent; outline: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink);
}
.sl-search input::placeholder { color: var(--ink-faint); }

.sl-density {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border-faint);
  border-radius: 6px;
  overflow: hidden;
}
.sl-density-btn {
  border: 0;
  background: transparent;
  padding: 4px 10px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  cursor: pointer;
}
.sl-density-btn.active { background: var(--ink); color: var(--surface); }

.sl-switch {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  cursor: pointer;
  user-select: none;
}
.sl-switch input { display: none; }
.sl-switch .track {
  width: 26px; height: 14px;
  background: var(--border);
  border-radius: 999px;
  position: relative;
}
.sl-switch .track::after {
  content: "";
  position: absolute; top: 2px; left: 2px;
  width: 10px; height: 10px;
  background: var(--surface);
  border-radius: 50%;
  transition: transform 120ms;
}
.sl-switch input:checked + .track { background: var(--ink); }
.sl-switch input:checked + .track::after { transform: translateX(12px); }

/* Focus rings (accessibility) */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}

/* ========================================================================
   Side panel
   ======================================================================== */
.sl-panel-backdrop {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.15);
  z-index: 40;
}
.sl-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px; max-width: 100vw;
  background: var(--surface-2);
  border-left: 1px solid var(--border);
  z-index: 50;
  display: flex; flex-direction: column;
  box-shadow: -8px 0 24px rgba(0, 0, 0, 0.08);
}
@media (max-width: 899px) { .sl-panel { width: 100vw; } }

.sl-panel-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-faint);
}
.sl-panel-title {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--fs-lg);
  letter-spacing: -0.01em;
  color: var(--ink);
}
.sl-panel-meta {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-faint);
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink-muted);
  display: flex; justify-content: space-between; gap: 12px;
}
.sl-panel-meta .k { color: var(--ink-faint); margin-right: 6px; }

.sl-panel-actions {
  display: flex; gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-faint);
  flex-wrap: wrap;
}
.sl-btn {
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.sl-btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.sl-panel-thread { flex: 1; padding: 14px 16px; overflow-y: auto; }
.sl-panel-thread .msg { margin-bottom: 14px; }
.sl-panel-thread .msg-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
}
.sl-panel-thread .msg-from { font-weight: 600; color: var(--ink); }
.sl-panel-thread .msg-time { font-family: var(--font-mono); color: var(--ink-faint); }
.sl-panel-thread .msg-body {
  font-family: var(--font-serif);
  font-size: var(--fs-base);
  color: var(--ink-muted);
  line-height: 1.5;
  margin-top: 3px;
  white-space: pre-wrap;
}
.sl-panel-thread .msg.me .msg-from { color: var(--ink-faint); }

.sl-panel-note {
  padding: 12px 16px;
  border-top: 1px solid var(--border-faint);
  background: var(--surface);
}
.sl-note-label {
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.sl-panel-note textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 42px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  color: var(--ink);
  resize: vertical;
  outline: 0;
}
.sl-panel-note textarea:focus { border-color: var(--ink-muted); }

/* ========================================================================
   Hover actions on item rows + inline dropdown menu
   ======================================================================== */
.sl-item-actions {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  display: inline-flex; gap: 2px;
  opacity: 0; pointer-events: none;
  transition: opacity 120ms;
  background: var(--surface);
  padding: 3px;
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  z-index: 10;
}
.sl-item:hover .sl-item-actions { opacity: 1; pointer-events: auto; }
.sl-item-actions button {
  border: 0; background: transparent;
  font-size: 13px;
  color: var(--ink-muted);
  padding: 4px 6px;
  border-radius: 4px;
  cursor: pointer;
}
.sl-item-actions button:hover { background: var(--surface-2); color: var(--ink); }

.sl-menu {
  position: absolute;
  z-index: 60;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  padding: 4px;
  min-width: 180px;
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
}
.sl-menu button {
  display: block; width: 100%;
  text-align: left;
  padding: 5px 10px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: inherit; font-size: inherit;
  border-radius: 4px;
  cursor: pointer;
}
.sl-menu button:hover { background: var(--surface-2); }

/* Snoozed visual treatment */
.sl-item[data-snoozed="1"] { opacity: 0.5; }
.sl-item[data-snoozed="1"] .sl-item-bar { position: relative; }
.sl-item[data-snoozed="1"] .sl-item-bar::after {
  content: "☾"; position: absolute; left: 3px; top: -10px;
  font-size: 9px; color: var(--ink-faint);
}

/* Keyboard-navigation focus on item rows */
.sl-item[data-kb-focus="1"] {
  background: var(--surface-2);
  outline: 2px solid var(--ink);
  outline-offset: -2px;
}
</style>
</head>
<body>
  <!-- Topbar: wordmark · freshness · theme toggle · reload -->
  <header class="sl-topbar">
    <div class="sl-brand">SlackLens</div>
    <div class="sl-topbar-right">
      <div id="freshness" class="sl-fresh">0 · loading…</div>
      <button id="themeToggle" class="sl-iconbtn" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <!-- Toolbar: category filters · status filters · search · density · snoozed -->
  <nav class="sl-toolbar" aria-label="Filters and controls">
    <div class="sl-pills" id="categoryPills" role="radiogroup" aria-label="Category filter">
      <button class="sl-pill active" data-scope="all"         type="button">All <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="needs_reply" type="button">Needs reply <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="mentions"    type="button">Mentions <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="dms"         type="button">DMs <span class="count">0</span></button>
      <button class="sl-pill"        data-scope="channels"    type="button">Channels <span class="count">0</span></button>
    </div>
    <div class="sl-divider"></div>
    <div class="sl-pills" id="statusPills" aria-label="Status filter">
      <button class="sl-pill" data-status="BACKLOG"     type="button">Backlog</button>
      <button class="sl-pill" data-status="IN PROGRESS" type="button">In progress</button>
      <button class="sl-pill" data-status="WAITING"     type="button">Waiting</button>
      <button class="sl-pill" data-status="DONE"        type="button">Done</button>
    </div>
    <div class="sl-divider"></div>
    <label class="sl-search">
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="text" placeholder="Search channel, person, text…" />
    </label>
    <div class="sl-density" role="radiogroup" aria-label="Density">
      <button class="sl-density-btn" data-density="compact"  type="button">Compact</button>
      <button class="sl-density-btn active" data-density="balanced" type="button">Balanced</button>
      <button class="sl-density-btn" data-density="spacious" type="button">Spacious</button>
    </div>
    <label class="sl-switch" id="showSnoozedLabel">
      <input id="showSnoozed" type="checkbox" />
      <span class="track"></span>
      <span class="label">Show snoozed</span>
    </label>
  </nav>

  <!-- Banner: stale cache / schema mismatch / fetch-failed -->
  <div id="banner" class="sl-banner" hidden></div>

  <!-- Triage layout:
         1. VIP band (full-width, top) — mentions/DMs/channels tagged VIP
         2. Two-column grid below:
              • left  = channels + group DMs (higher signal, don't lose)
              • right = 1:1 DMs -->
  <main id="channelFlow" class="sl-flow" aria-label="Triage">
    <section id="vipBand" class="sl-vip-band" aria-label="High priority" hidden>
      <div id="vipBandInner" class="sl-vip-band-inner"></div>
    </section>
    <div class="sl-grid-2col">
      <section id="leftCol"  class="sl-col sl-col--channels" aria-label="Channels and group DMs"></section>
      <section id="rightCol" class="sl-col sl-col--dms"      aria-label="Direct messages"></section>
    </div>
  </main>

  <!-- Empty state container (shown when nothing renders) -->
  <div id="emptyState" class="sl-empty" hidden></div>

  <footer class="sl-footer">
    <span>SlackLens · data: <code>~/.slacklens/cache.json</code></span>
  </footer>

  <!-- Side panel (BELOW all interactive content, ABOVE the script tag) -->
  <aside id="sidePanel" class="sl-panel" hidden aria-label="Thread detail">
    <div class="sl-panel-head">
      <div class="sl-panel-title">
        <span id="panelChannel"></span>
      </div>
      <button id="panelClose" class="sl-iconbtn" type="button" aria-label="Close panel">✕</button>
    </div>
    <div class="sl-panel-meta">
      <div><span class="k">Channel</span><span id="panelChannelType"></span></div>
      <div><span class="k">Status</span><span id="panelStatus"></span></div>
    </div>
    <div class="sl-panel-actions">
      <button id="actStatus"  class="sl-btn" type="button">◐ Status ▾</button>
      <button id="actSnooze"  class="sl-btn" type="button">☾ Snooze ▾</button>
      <button id="actDone"    class="sl-btn" type="button">✓ Mark done</button>
      <button id="actOpen"    class="sl-btn primary" type="button">↗ Open in Slack</button>
      <button id="actCopy"    class="sl-btn" type="button">⎘ Copy permalink</button>
    </div>
    <div id="panelThread" class="sl-panel-thread"></div>
    <div class="sl-panel-note">
      <div class="sl-note-label">Note</div>
      <textarea id="panelNote" placeholder="Add a private note about this thread (saved locally)"></textarea>
    </div>
  </aside>
  <div id="panelBackdrop" class="sl-panel-backdrop" hidden></div>

<script>
// ---------- Inlined cache (works under file://) ----------
// The cache-blob sentinel on the line AFTER the assignment below is
// load-bearing. Do not remove it. Refresh/setup use it as the regex
// terminator so a user message containing the JS closing-brace pair
// cannot end the non-greedy match early. (This comment intentionally
// avoids naming the assignment's identifier or the sentinel text so
// that the regex does not match inside the comment itself.)
window.__SLACK_CACHE__ = {
  "refreshed_at": null,
  "search_results": { "mentions": [], "dms": [], "channels": [] },
  "threads": {}
};
// __SLACK_CACHE_END__

// ---------- State ----------
const LS_KEY = 'slackTriageOverrides.v1';
const STATUSES = ['AWAITING YOUR REPLY','BACKLOG','IN PROGRESS','WAITING','DISCUSSION','DONE'];
const ME_ID = '';
const ME_NAME = '';
const VIP_IDS = [];  // VIPs (filled by slacklens-setup)
const VIP_NAMES = [];

let raw = null;       // parsed cache JSON
let items = [];       // normalized list
let filter = { scope:'all', status:[], query:'', showSnoozed:false };
let overrides = loadOverrides();
// Workspace origin (e.g. 'https://example.slack.com'), derived from the
// first permalink we see in the cache. Falls back to slack.com so the
// link-out still resolves to Slack's router for unknown workspaces.
let WORKSPACE_ORIGIN = 'https://slack.com';

function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
  catch { return {}; }
}
function saveOverrides() {
  localStorage.setItem(LS_KEY, JSON.stringify(overrides));
}
function overrideFor(key) {
  if (!overrides[key]) overrides[key] = {};
  return overrides[key];
}

// ---------- Loading ----------
function clearBanner() {
  const b = document.getElementById('banner');
  if (!b) return;
  b.hidden = true;
  b.removeAttribute('data-severity');
  b.textContent = '';
}
function showBanner(severity, text) {
  const b = document.getElementById('banner');
  if (!b) return;
  b.hidden = false;
  b.dataset.severity = severity;
  b.textContent = text;
}
function checkSchemaBanner() {
  if (!raw || !raw.search_results) return;
  const sr = raw.search_results;
  const hasOldKeys = ('dms_received' in sr) || ('outgoing_dms' in sr);
  const hasNewKeys = ('mentions' in sr) && ('dms' in sr) && ('channels' in sr);
  if (hasOldKeys && !hasNewKeys) {
    showBanner('warn', 'Your cache predates v0.2.0 — run "refresh slacklens" to rebuild.');
  }
}

// Parse the cache embedded in this file and render. The dashboard ships as
// a self-contained file:// artifact; fresh Slack data requires running the
// `slacklens-refresh` skill, which rewrites the embedded blob in place.
// A browser refresh then re-reads the file and re-runs this function.
function loadCache() {
  clearBanner();
  if (window.__SLACK_CACHE__) {
    raw = window.__SLACK_CACHE__;
    normalize();
    checkSchemaBanner();
    render();
    return;
  }
  showBanner('warn', 'No cache data available.');
  const f = document.getElementById('freshness');
  if (f) f.textContent = 'No cache loaded.';
}

// Normalize mentions + threads into a single item list
function normalize() {
  items = [];
  const seen = new Set();
  deriveWorkspaceOrigin();

  // 1) Threads (richer — have message history)
  const threads = raw.threads || {};
  Object.entries(threads).forEach(([threadKey, t]) => {
    if (!t || !t.channel_id) return;
    const msgs = (t.messages || []).slice().sort((a,b) => (+a.ts||0) - (+b.ts||0));
    const last = msgs[msgs.length - 1];
    const firstNonMe = msgs.find(m => !isMe(m.from));
    const permalink = deriveThreadPermalink(t, last || firstNonMe);
    const key = permalink || (t.channel_id + '/' + (t.thread_ts || 'top'));
    if (seen.has(key)) return; seen.add(key);

    const lastFrom = last ? cleanName(last.from) : '';
    const lastIsMe = last ? isMe(last.from) : false;
    const lastText = last ? last.text : '';
    const lastTime = last ? last.time : '';
    // Slack `ts` is a numeric epoch string — reliable for sorting regardless
    // of the timezone suffix on `last_time` ("IST", "PST" etc).
    const lastTs   = last ? (+last.ts || 0) : 0;

    const derived = inferStatus({
      channel_name: t.channel_name,
      lastIsMe, lastText, msgs
    });

    items.push({
      key,
      kind: kindFromChannel(t.channel_name, t.channel_id),
      channel_id: t.channel_id,
      channel_name: t.channel_name,
      channel_display: prettyChannel(t.channel_name, t.channel_id),
      permalink,
      last_from: lastFrom,
      last_is_me: lastIsMe,
      last_text: lastText,
      last_time: lastTime,
      last_ts: lastTs,
      msg_count: msgs.length,
      participants: Array.from(new Set(msgs.map(m => cleanName(m.from)))).filter(Boolean),
      status: derived.status,
      needs_reply: derived.needs_reply,
      source: 'thread',
    });
  });

  // 2) Mentions (messages addressed to you) — add as items if not already covered by a thread
  const mentionsQueries = (raw.search_results && raw.search_results.mentions) || [];
  mentionsQueries.forEach(q => (q.results || []).forEach(m => {
    if (!m.permalink) return;
    // If we already have a thread whose key matches this channel, skip duplicating
    const existing = items.find(it => it.channel_id === m.channel_id);
    if (existing) return;
    if (seen.has(m.permalink)) return; seen.add(m.permalink);
    items.push({
      key: m.permalink,
      kind: kindFromChannel(m.channel_name, m.channel_id),
      channel_id: m.channel_id,
      channel_name: m.channel_name,
      channel_display: prettyChannel(m.channel_name, m.channel_id),
      permalink: m.permalink,
      last_from: cleanName(m.from_user),
      last_is_me: isMe(m.from_user),
      last_text: m.text,
      last_time: m.time,
      last_ts: +m.message_ts || 0,
      msg_count: 1,
      participants: [cleanName(m.from_user)].filter(Boolean),
      status: 'AWAITING YOUR REPLY',
      needs_reply: !isMe(m.from_user),
      source: 'mention',
    });
  }));

  items.forEach(it => {
    it.channel_key = it.channel_id;
    it.channel_is_vip = threadHasVIP(it);
  });

  items.sort((a, b) => (b.last_ts || 0) - (a.last_ts || 0));
}

// Escape a string so it can be embedded safely in a RegExp source.
function reEscape(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// Slack IDs (U01…, C01…) are unique — safe to substring-match.
// Names must be word-bounded: plain substring match would let "Ann" hit
// "Annie" and promote unrelated threads into the VIP band, and let a user
// "Sam" match every message from "Samantha". `\b` is ASCII-only in JS, which
// is good enough for the English-Latin Slack names we see in practice.
function nameMatches(name, s) {
  if (!name || !s) return false;
  return new RegExp('\\b' + reEscape(name) + '\\b', 'i').test(s);
}
function isMe(s) {
  if (!s) return false;
  if (ME_ID && s.includes(ME_ID)) return true;
  return nameMatches(ME_NAME, s);
}
function isVIP(s) {
  if (!s) return false;
  if (VIP_IDS.some(id => id && s.includes(id))) return true;
  return VIP_NAMES.some(n => nameMatches(n, s));
}
function threadHasVIP(it) {
  // Check last_from, participants, channel_display for any VIP
  if (isVIP(it.last_from)) return true;
  if (it.participants && it.participants.some(p => isVIP(p))) return true;
  if (isVIP(it.channel_display)) return true;
  return false;
}
function cleanName(s) {
  if (!s) return '';
  return s.replace(/\s*\([UC][0-9A-Z]+\)\s*$/,'').trim();
}
function kindFromChannel(name, id) {
  const n = (name||'').toLowerCase();
  if (n.startsWith('dm (') || (id||'').startsWith('D')) return 'dm';
  if (n.startsWith('group dm')) return 'dm';
  return 'channel';
}
function isGroupDM(name) {
  return (name||'').toLowerCase().startsWith('group dm');
}
function prettyChannel(name, id) {
  if (!name) return id || '?';
  if (name.toLowerCase().startsWith('dm (')) {
    // e.g. "DM (You, Other)" -> "@Other"
    const m = name.match(/\((.+)\)/);
    if (m) {
      const parts = m[1].split(',').map(s => s.trim()).filter(s => !isMe(s));
      return '@' + (parts[0] || 'DM');
    }
  }
  if (name.toLowerCase().startsWith('group dm')) {
    const m = name.match(/\((.+)\)/);
    if (m) {
      const parts = m[1].split(',').map(s => s.trim()).filter(s => !isMe(s));
      return 'Group · ' + parts.slice(0,2).join(', ') + (parts.length>2?'…':'');
    }
    return 'Group DM';
  }
  return '#' + name.replace(/^#/,'');
}
function deriveThreadPermalink(t, msg) {
  if (msg && msg.permalink) return msg.permalink;
  const ts = (t.thread_ts && t.thread_ts !== 'top_level') ? t.thread_ts : (msg ? msg.ts : '');
  if (!ts) return `${WORKSPACE_ORIGIN}/archives/${t.channel_id}`;
  return `${WORKSPACE_ORIGIN}/archives/${t.channel_id}/p${ts.replace('.','')}`;
}
// Scan the cache for the first permalink and extract its origin
// (e.g. 'https://acme.slack.com') so fallback links stay on the right
// workspace without hardcoding it.
function deriveWorkspaceOrigin() {
  const sr = (raw && raw.search_results) || {};
  const buckets = [sr.mentions, sr.dms, sr.channels, Object.values(raw && raw.threads || {})];
  for (const bucket of buckets) {
    if (!bucket) continue;
    for (const entry of bucket) {
      const results = entry && (entry.results || entry.messages);
      if (!results) continue;
      for (const r of results) {
        if (r && typeof r.permalink === 'string' && r.permalink.startsWith('http')) {
          try { WORKSPACE_ORIGIN = new URL(r.permalink).origin; return; }
          catch (_) { /* ignore malformed */ }
        }
      }
    }
  }
}
function inferStatus({channel_name, lastIsMe, lastText, msgs}) {
  // Heuristics — user's overrides (if any) win at render time.
  const text = (lastText || '').toLowerCase();
  if (/resolved|fixed|merged|done|thanks, done/.test(text)) return {status:'DONE', needs_reply:false};
  if (lastIsMe) {
    // I spoke last — waiting on someone else
    return {status:'WAITING', needs_reply:false};
  }
  // Someone else spoke last — I likely owe a reply
  if (/eta|breach|urgent|please|need to|blocker/.test(text)) return {status:'BACKLOG', needs_reply:true};
  if (/check|verify|review|confirm|pr\s*#?\d/.test(text)) return {status:'AWAITING YOUR REPLY', needs_reply:true};
  return {status:'AWAITING YOUR REPLY', needs_reply:true};
}

// ---------- Rendering ----------

// Group items by channel_id, then split into three buckets:
//   vip   — VIP channels / DMs / channels containing a VIP mention
//   left  — non-VIP channels AND non-VIP group DMs (higher signal, left column)
//   right — non-VIP 1:1 DMs (right column)
// Each channel: { key, name, display, kind, is_vip, is_group_dm, last_ts, last_time, items }
function partitionByChannel(flatItems) {
  const byKey = new Map();
  for (const it of flatItems) {
    if (!byKey.has(it.channel_key)) {
      byKey.set(it.channel_key, {
        key: it.channel_key,
        name: it.channel_name || it.channel_id,
        display: it.channel_display || it.channel_name || it.channel_id,
        kind: it.kind,
        is_vip: false,
        is_group_dm: isGroupDM(it.channel_name),
        last_ts: 0,
        last_time: '',
        items: [],
      });
    }
    const ch = byKey.get(it.channel_key);
    ch.items.push(it);
    if (it.channel_is_vip) ch.is_vip = true;
    if ((it.last_ts || 0) > ch.last_ts) {
      ch.last_ts = it.last_ts;
      ch.last_time = it.last_time;  // kept for display only
    }
  }
  const all = Array.from(byKey.values());
  const byRecency = (a, b) => (b.last_ts || 0) - (a.last_ts || 0);

  const vip   = all.filter(c => c.is_vip).sort(byRecency);
  const left  = all.filter(c => !c.is_vip && (c.kind === 'channel' || c.is_group_dm)).sort(byRecency);
  const right = all.filter(c => !c.is_vip && c.kind === 'dm' && !c.is_group_dm).sort(byRecency);
  return { vip, left, right, total: all.length };
}

function render() {
  const vipBand   = document.getElementById('vipBand');
  const vipInner  = document.getElementById('vipBandInner');
  const leftCol   = document.getElementById('leftCol');
  const rightCol  = document.getElementById('rightCol');
  const empty     = document.getElementById('emptyState');
  if (!vipInner || !leftCol || !rightCol) return;
  vipInner.innerHTML = '';
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  const shown = applyFilter(items);
  const parts = partitionByChannel(shown);

  // Four empty-state paths — the differentiation matters for UX, so keep
  // each branch distinct. "Never refreshed" and "refreshed but silent"
  // look identical at the raw-count level but feel very different to users.
  const neverRefreshed = !raw || !raw.refreshed_at ||
    (!raw.search_results && !raw.threads);
  if (neverRefreshed) {
    empty.hidden = false;
    empty.innerHTML =
      '<h4>No cache loaded yet</h4>' +
      '<p>Say <code>refresh slacklens</code> in Claude to populate this dashboard. ' +
      'Refreshing the page won\'t help — the embedded cache is still empty.</p>';
    vipBand.hidden = true;
    return;
  }

  const activelyFiltered =
    filter.scope !== 'all' ||
    (Array.isArray(filter.status) && filter.status.length > 0) ||
    (filter.query || '').trim() !== '';

  if (parts.total === 0 && activelyFiltered) {
    empty.hidden = false;
    empty.innerHTML =
      '<h4>Nothing matches</h4>' +
      '<p>Your filter did not match any threads.</p>' +
      '<button id="emptyClear" type="button">Clear filter</button>';
    const clear = document.getElementById('emptyClear');
    if (clear) clear.onclick = () => {
      filter.scope = 'all';
      filter.status = [];
      filter.query = '';
      const si = document.getElementById('searchInput');
      if (si) si.value = '';
      document.querySelectorAll('#categoryPills .sl-pill').forEach(b =>
        b.classList.toggle('active', b.dataset.scope === 'all'));
      document.querySelectorAll('#statusPills .sl-pill').forEach(b => b.classList.remove('active'));
      render();
    };
    vipBand.hidden = true;
    return;
  }

  if (parts.total === 0) {
    // Genuine quiet period — cache is fresh, Slack just returned nothing.
    // Show when we last checked so the user can tell this apart from
    // "maybe refresh is broken?".
    empty.hidden = false;
    const t = Date.parse(raw.refreshed_at);
    const ageHours = isFinite(t) ? (Date.now() - t) / 3600000 : null;
    const ageStr = ageHours != null ? humanAge(ageHours) : 'recently';
    empty.innerHTML =
      '<h4>Nothing in the last 48 hours</h4>' +
      `<p>Cache is fresh (refreshed ${ageStr}). Catch your breath — or say ` +
      '<code>refresh slacklens</code> to check again.</p>';
    vipBand.hidden = true;
    return;
  }
  empty.hidden = true;

  // VIP band — only show if non-empty
  vipBand.hidden = parts.vip.length === 0;
  for (const ch of parts.vip)   vipInner.appendChild(renderChannel(ch, 'vip'));
  for (const ch of parts.left)  leftCol.appendChild(renderChannel(ch, 'channel'));
  for (const ch of parts.right) rightCol.appendChild(renderChannel(ch, 'dm'));

  updateCounts(shown);
  updateFreshness();
}

function renderChannel(ch, colKind) {
  const wrap = document.createElement('section');
  wrap.className = 'sl-channel';
  wrap.dataset.vip = ch.is_vip ? '1' : '0';
  wrap.dataset.col = colKind || '';

  const head = document.createElement('header');
  head.className = 'sl-channel-head';
  const name = document.createElement('div');
  name.className = 'sl-channel-name';
  name.textContent = ch.display;
  head.appendChild(name);

  const meta = document.createElement('div');
  meta.className = 'sl-channel-meta';
  const shortTime = (ch.last_time || '').slice(11, 16);  // "HH:MM" from "YYYY-MM-DD HH:MM:SS ..."
  meta.textContent = ch.items.length > 1
    ? `${shortTime} · ${ch.items.length}`
    : shortTime;
  head.appendChild(meta);

  wrap.appendChild(head);
  for (const it of ch.items) wrap.appendChild(renderItem(it));
  return wrap;
}

function renderItem(it) {
  const row = document.createElement('article');
  row.className = 'sl-item';
  row.dataset.key = it.key;
  row.dataset.status = (effectiveItem(it).status || 'AWAITING YOUR REPLY').toUpperCase();

  const bar = document.createElement('div');
  bar.className = 'sl-item-bar';
  row.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'sl-item-body';
  const head = document.createElement('div');
  head.className = 'sl-item-head';
  const from = document.createElement('span');
  from.className = 'sl-item-from';
  from.textContent = cleanName(it.last_from || '');
  const time = document.createElement('span');
  time.className = 'sl-item-time';
  time.textContent = (it.last_time || '').slice(11, 16);
  head.appendChild(from); head.appendChild(time);
  body.appendChild(head);

  const msg = document.createElement('div');
  msg.className = 'sl-item-msg';
  msg.textContent = it.last_text || '';
  body.appendChild(msg);

  if (it.msg_count > 1 && it.participants && it.participants.length > 1) {
    const others = it.participants.filter(p => !isMe(p));
    if (others.length) {
      const thread = document.createElement('div');
      thread.className = 'sl-item-thread';
      const preview = others.slice(0, 2).join(', ');
      const extra = others.length > 2 ? ` +${others.length - 2}` : '';
      thread.textContent = `${it.msg_count} msgs · ${preview}${extra}`;
      body.appendChild(thread);
    }
  }
  row.appendChild(body);

  // Snoozed visual flag
  const eff2 = effectiveItem(it);
  const snoozedUntil = eff2.snooze_until ? Date.parse(eff2.snooze_until) : 0;
  if (snoozedUntil && snoozedUntil > Date.now()) row.dataset.snoozed = '1';

  // Hover action cluster
  const actions = document.createElement('div');
  actions.className = 'sl-item-actions';
  actions.innerHTML = [
    '<button data-action="status"  title="Change status"  aria-label="Change status">◐</button>',
    '<button data-action="snooze"  title="Snooze"         aria-label="Snooze">☾</button>',
    '<button data-action="done"    title="Mark done"      aria-label="Mark done">✓</button>',
    '<button data-action="open"    title="Open in Slack"  aria-label="Open in Slack">↗</button>',
    '<button data-action="copy"    title="Copy permalink" aria-label="Copy permalink">⎘</button>',
  ].join('');
  row.appendChild(actions);

  return row;
}

function applyFilter(xs) {
  const q = (filter.query || '').toLowerCase().trim();
  const now = Date.now();
  // Migration safety: allow filter.status as string or array
  const statusList = Array.isArray(filter.status)
    ? filter.status
    : (filter.status ? [filter.status] : []);

  return xs.filter(it => {
    const eff = effectiveItem(it);

    // Snoozed filter (unless showing snoozed)
    const snoozedUntil = eff.snooze_until ? Date.parse(eff.snooze_until) : 0;
    const isSnoozed = snoozedUntil && snoozedUntil > now;
    if (isSnoozed && !filter.showSnoozed) return false;

    // Scope
    if (filter.scope === 'needs_reply'  && !eff.needs_reply)      return false;
    if (filter.scope === 'mentions'     && it.source !== 'mention') return false;
    if (filter.scope === 'dms'          && it.kind !== 'dm')      return false;
    if (filter.scope === 'channels'     && it.kind !== 'channel') return false;

    // Status (multi-select)
    if (statusList.length && !statusList.includes((eff.status || '').toUpperCase())) return false;

    // Search across channel/person/text/participants
    if (q) {
      const hay = (it.channel_display + ' ' + (it.last_from || '') + ' ' +
                   (it.last_text || '') + ' ' + (it.participants || []).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }

    return true;
  });
}

function updateCounts(shownItems) {
  const counts = { all: shownItems.length, needs_reply: 0, mentions: 0, dms: 0, channels: 0 };
  for (const it of shownItems) {
    const eff = effectiveItem(it);
    if (eff.needs_reply)            counts.needs_reply++;
    if (it.source === 'mention')    counts.mentions++;
    if (it.kind === 'dm')           counts.dms++;
    if (it.kind === 'channel')      counts.channels++;
  }
  document.querySelectorAll('#categoryPills .sl-pill').forEach(btn => {
    const k = btn.dataset.scope;
    const c = btn.querySelector('.count');
    if (c && counts[k] !== undefined) c.textContent = counts[k];
  });
}

function bootFilters() {
  // Category pills (single-select)
  document.querySelectorAll('#categoryPills .sl-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      filter.scope = btn.dataset.scope;
      document.querySelectorAll('#categoryPills .sl-pill').forEach(b =>
        b.classList.toggle('active', b === btn));
      render();
    });
  });
  // Status pills (multi-select)
  document.querySelectorAll('#statusPills .sl-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.status;
      if (!Array.isArray(filter.status)) filter.status = [];
      const i = filter.status.indexOf(s);
      if (i >= 0) { filter.status.splice(i, 1); btn.classList.remove('active'); }
      else        { filter.status.push(s);      btn.classList.add('active'); }
      render();
    });
  });
  // Search (debounced 150ms)
  const input = document.getElementById('searchInput');
  let tmr = null;
  if (input) input.addEventListener('input', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => { filter.query = input.value; render(); }, 150);
  });
  // Show snoozed
  const snz = document.getElementById('showSnoozed');
  if (snz) snz.addEventListener('change', () => { filter.showSnoozed = snz.checked; render(); });
}
const STALE_CACHE_HOURS = 12;      // amber: ">12h" — worth refreshing soon
const VERY_STALE_CACHE_HOURS = 24; // red: ">24h" — data is a day old

function updateFreshness() {
  const f = document.getElementById('freshness');
  if (!f) return;
  const total = items.length;
  if (!raw || !raw.refreshed_at) {
    f.textContent = `${total} · no data`;
    f.removeAttribute('data-stale');
    f.removeAttribute('title');
    return;
  }
  const t = Date.parse(raw.refreshed_at);
  const ageHours = (Date.now() - t) / 3600000;
  // Show both the precise refresh time AND the relative age, so the user
  // can decide at a glance whether to force another refresh. Format:
  //   "21 · 14:30 · 2h ago"
  //   "21 · Apr 21 14:30 · 2d ago"   (older than 24h)
  const d = new Date(t);
  const pad = n => String(n).padStart(2, '0');
  const hhmm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const datePrefix = (ageHours >= 24)
    ? `${months[d.getMonth()]} ${d.getDate()} `
    : '';
  f.textContent = `${total} · ${datePrefix}${hhmm} · ${humanAge(ageHours)}`;
  f.title = `Cache refreshed at ${raw.refreshed_at}. Say "refresh slacklens" for a delta update, "deep refresh slacklens" to force a full 48h re-fetch.`;
  let staleLevel = '0';
  if (ageHours > VERY_STALE_CACHE_HOURS)   staleLevel = '2';
  else if (ageHours > STALE_CACHE_HOURS)   staleLevel = '1';
  f.dataset.stale = staleLevel;
}

function humanAge(h) {
  if (h < 0.05) return 'just now';
  if (h < 1)    return `${Math.round(h * 60)}m ago`;
  if (h < 24)   return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

function effectiveItem(it) {
  const ov = overrides[it.key] || {};
  return {
    status: ov.status || it.status,
    needs_reply: (ov.needs_reply !== undefined) ? ov.needs_reply : it.needs_reply,
    snoozed: !!ov.snoozed,
    note: ov.note || '',
  };
}

// ========================================================================
// Density toggle (slacklens.density: 'compact' | 'balanced' | 'spacious')
// ========================================================================
const DENSITY_KEY = 'slacklens.density';
const DENSITY_VALUES = ['compact', 'balanced', 'spacious'];

function applyDensity(d) {
  if (!DENSITY_VALUES.includes(d)) d = 'balanced';
  document.documentElement.setAttribute('data-density', d);
  document.querySelectorAll('.sl-density-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.density === d);
  });
  try { localStorage.setItem(DENSITY_KEY, d); } catch (_) {}
}

function bootDensity() {
  let d;
  try { d = localStorage.getItem(DENSITY_KEY); } catch (_) { d = null; }
  applyDensity(d || 'balanced');
  document.querySelectorAll('.sl-density-btn').forEach(btn => {
    btn.addEventListener('click', () => applyDensity(btn.dataset.density));
  });
}

// ========================================================================
// Theme toggle (slacklens.theme: 'auto' | 'light' | 'dark'; default 'auto')
// ========================================================================
const THEME_KEY = 'slacklens.theme';
const THEME_CYCLE = ['auto', 'light', 'dark'];

function currentSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(t) {
  if (!THEME_CYCLE.includes(t)) t = 'auto';
  const effective = (t === 'auto') ? currentSystemTheme() : t;
  // For 'auto', let the prefers-color-scheme media query drive colors by
  // leaving data-theme unset. For 'light' or 'dark', set data-theme
  // explicitly so the media query's :not([data-theme]) branch doesn't
  // override the user's explicit choice.
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else              document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.textContent = (effective === 'dark') ? '☼' : '☾';
    btn.title = 'Theme: ' + t + ' (click to cycle)';
  }
  try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
}

function bootTheme() {
  let t;
  try { t = localStorage.getItem(THEME_KEY); } catch (_) { t = null; }
  applyTheme(t || 'auto');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.addEventListener('click', () => {
    const current = localStorage.getItem(THEME_KEY) || 'auto';
    const next = THEME_CYCLE[(THEME_CYCLE.indexOf(current) + 1) % THEME_CYCLE.length];
    applyTheme(next);
  });
  // Respond to system changes while on auto
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    const current = localStorage.getItem(THEME_KEY) || 'auto';
    if (current === 'auto') applyTheme('auto');
  });
}

// ========================================================================
// Keyboard shortcuts
//   /  focus search     T  cycle theme     D  cycle density
//   ESC close panel / clear focused input
//   J/K  next/prev item (nice-to-have)
// ========================================================================
function bootKeyboard() {
  document.addEventListener('keydown', e => {
    const active = document.activeElement;
    const inInput = active && ['INPUT', 'TEXTAREA'].includes(active.tagName);

    if (e.key === 'Escape') {
      if (inInput) active.blur();
      // side panel ESC is handled by bootSidePanel's own listener
      return;
    }
    if (inInput) return;

    if (e.key === '/') { e.preventDefault(); const si = document.getElementById('searchInput'); if (si) si.focus(); return; }
    if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      const current = localStorage.getItem(THEME_KEY) || 'auto';
      const next = THEME_CYCLE[(THEME_CYCLE.indexOf(current) + 1) % THEME_CYCLE.length];
      applyTheme(next);
      return;
    }
    if (e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      const current = localStorage.getItem(DENSITY_KEY) || 'balanced';
      const next = DENSITY_VALUES[(DENSITY_VALUES.indexOf(current) + 1) % DENSITY_VALUES.length];
      applyDensity(next);
      return;
    }
    if (e.key === 'j' || e.key === 'k') {
      e.preventDefault();
      const rows = Array.from(document.querySelectorAll('.sl-item'));
      if (!rows.length) return;
      const focused = document.querySelector('.sl-item[data-kb-focus="1"]');
      let idx = focused ? rows.indexOf(focused) : -1;
      rows.forEach(r => r.removeAttribute('data-kb-focus'));
      idx = (e.key === 'j') ? Math.min(idx + 1, rows.length - 1) : Math.max(idx - 1, 0);
      const next = rows[Math.max(0, idx)];
      next.setAttribute('data-kb-focus', '1');
      next.scrollIntoView({ block: 'nearest' });
    }
  });
}

// ---------- Wire up ----------
bootDensity();
bootTheme();
bootFilters();
bootSidePanel();
bootKeyboard();
loadCache();

// ========================================================================
// Side panel
// ========================================================================
let panelItemKey = null;     // key of currently-open item (null = closed)
let panelTriggerEl = null;   // element that opened it, for focus restoration

function findItem(key) { return items.find(it => it.key === key); }

function threadMessagesFor(it) {
  // Find a full thread in raw.threads by matching channel_id prefix;
  // fall back to a synthetic single-message array.
  if (raw && raw.threads) {
    const key = Object.keys(raw.threads).find(k => k.startsWith(it.channel_id + ':'));
    if (key && raw.threads[key] && raw.threads[key].messages) {
      return raw.threads[key].messages;
    }
  }
  return [{ from: it.last_from, ts: '0', time: it.last_time, text: it.last_text, permalink: it.permalink }];
}

function openPanel(itemKey, triggerEl) {
  const it = findItem(itemKey);
  if (!it) return;
  panelItemKey = itemKey;
  panelTriggerEl = triggerEl || null;

  const eff = effectiveItem(it);
  document.getElementById('panelChannel').textContent = it.channel_display || it.channel_name || it.channel_id;
  document.getElementById('panelChannelType').textContent =
    it.kind === 'dm' ? 'Direct message' : (it.kind === 'channel' ? 'Channel' : 'Thread');
  document.getElementById('panelStatus').textContent = eff.status || 'AWAITING YOUR REPLY';
  document.getElementById('panelNote').value = eff.note || '';

  // Action handlers (bound fresh each open so they close over `it`)
  document.getElementById('actOpen').onclick = () => { if (it.permalink) window.open(it.permalink, '_blank'); };
  document.getElementById('actCopy').onclick = () => { if (it.permalink && navigator.clipboard) navigator.clipboard.writeText(it.permalink); };
  document.getElementById('actDone').onclick = () => {
    overrideFor(itemKey).status = 'DONE';
    saveOverrides(); render(); closePanel();
  };
  document.getElementById('actStatus').onclick = (e) => openStatusMenu(it, e.currentTarget);
  document.getElementById('actSnooze').onclick = (e) => openSnoozeMenu(it, e.currentTarget);

  // Render the thread messages
  const threadEl = document.getElementById('panelThread');
  threadEl.innerHTML = '';
  for (const m of threadMessagesFor(it)) {
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isMe(m.from) ? ' me' : '');
    const head = document.createElement('div');
    head.className = 'msg-head';
    const fromEl = document.createElement('span');
    fromEl.className = 'msg-from';
    fromEl.textContent = cleanName(m.from || '');
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = (m.time || '').slice(11, 16) || m.ts;
    head.appendChild(fromEl); head.appendChild(timeEl);
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = m.text || '';
    wrap.appendChild(head); wrap.appendChild(body);
    threadEl.appendChild(wrap);
  }

  // Highlight the selected row in background
  document.querySelectorAll('.sl-item[data-active="1"]').forEach(el => el.removeAttribute('data-active'));
  const row = document.querySelector(`.sl-item[data-key="${CSS.escape(itemKey)}"]`);
  if (row) row.setAttribute('data-active', '1');

  document.getElementById('sidePanel').hidden = false;
  document.getElementById('panelBackdrop').hidden = false;
  document.getElementById('panelClose').focus();

  // Persist note on blur
  document.getElementById('panelNote').onblur = () => {
    overrideFor(itemKey).note = document.getElementById('panelNote').value;
    saveOverrides();
  };
}

function closePanel() {
  panelItemKey = null;
  document.getElementById('sidePanel').hidden = true;
  document.getElementById('panelBackdrop').hidden = true;
  document.querySelectorAll('.sl-item[data-active="1"]').forEach(el => el.removeAttribute('data-active'));
  if (panelTriggerEl && typeof panelTriggerEl.focus === 'function') panelTriggerEl.focus();
  panelTriggerEl = null;
}

// ========================================================================
// Row actions + inline menus (status / snooze)
// ========================================================================
function handleRowAction(action, it, anchorEl) {
  if (!it) return;
  if (action === 'open')   { if (it.permalink) window.open(it.permalink, '_blank'); return; }
  if (action === 'copy')   { if (it.permalink && navigator.clipboard) navigator.clipboard.writeText(it.permalink); return; }
  if (action === 'done')   { overrideFor(it.key).status = 'DONE'; saveOverrides(); render(); return; }
  if (action === 'status') return openStatusMenu(it, anchorEl);
  if (action === 'snooze') return openSnoozeMenu(it, anchorEl);
}

function openMenu(anchorEl, itemsList) {
  closeOpenMenu();
  const menu = document.createElement('div');
  menu.className = 'sl-menu';
  menu.id = 'activeMenu';
  for (const mi of itemsList) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = mi.label;
    b.addEventListener('click', () => { mi.onClick(); closeOpenMenu(); });
    menu.appendChild(b);
  }
  const rect = anchorEl.getBoundingClientRect();
  menu.style.left = Math.max(8, rect.right - 180) + 'px';
  menu.style.top = (rect.bottom + 4 + window.scrollY) + 'px';
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', menuOutsideClick, { once: true }), 0);
}
function closeOpenMenu() {
  const m = document.getElementById('activeMenu');
  if (m) m.remove();
}
function menuOutsideClick(e) {
  if (!e.target.closest('#activeMenu')) closeOpenMenu();
}
function openStatusMenu(it, anchorEl) {
  openMenu(anchorEl, STATUSES.map(s => ({
    label: s,
    onClick: () => { overrideFor(it.key).status = s; saveOverrides(); render(); },
  })));
}
function openSnoozeMenu(it, anchorEl) {
  const now = Date.now();
  openMenu(anchorEl, [
    { label: '1 hour',             onClick: () => snooze(it, now + 60 * 60 * 1000) },
    { label: 'Until 9am tomorrow', onClick: () => {
        const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0);
        snooze(it, d.getTime());
    }},
    { label: 'Custom…', onClick: () => {
        const s = prompt('Snooze until (YYYY-MM-DD HH:MM):');
        if (!s) return;
        const t = Date.parse(s.replace(' ', 'T'));
        if (!isNaN(t)) snooze(it, t);
    }},
    { label: 'Clear snooze', onClick: () => { overrideFor(it.key).snooze_until = null; saveOverrides(); render(); }},
  ]);
}
function snooze(it, millis) {
  overrideFor(it.key).snooze_until = new Date(millis).toISOString();
  saveOverrides(); render();
}

function bootSidePanel() {
  document.getElementById('panelClose').addEventListener('click', closePanel);
  document.getElementById('panelBackdrop').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('sidePanel').hidden) closePanel();
  });

  // Click delegation on the channel flow — handle hover-action clicks first,
  // fall through to row click → open panel.
  document.getElementById('channelFlow').addEventListener('click', e => {
    const actBtn = e.target.closest('.sl-item-actions button');
    if (actBtn) {
      const row = actBtn.closest('.sl-item');
      const it = findItem(row.dataset.key);
      handleRowAction(actBtn.dataset.action, it, actBtn);
      e.stopPropagation();
      return;
    }
    const row = e.target.closest('.sl-item');
    if (!row) return;
    openPanel(row.dataset.key, row);
  });

  // Right-click shows the same combined menu
  document.getElementById('channelFlow').addEventListener('contextmenu', e => {
    const row = e.target.closest('.sl-item');
    if (!row) return;
    e.preventDefault();
    const it = findItem(row.dataset.key);
    if (!it) return;
    openMenu(row, [
      { label: 'Open in Slack',   onClick: () => { if (it.permalink) window.open(it.permalink, '_blank'); } },
      { label: 'Copy permalink',  onClick: () => { if (it.permalink && navigator.clipboard) navigator.clipboard.writeText(it.permalink); } },
      { label: 'Mark done',       onClick: () => { overrideFor(it.key).status = 'DONE'; saveOverrides(); render(); } },
      { label: 'Change status…',  onClick: () => openStatusMenu(it, row) },
      { label: 'Snooze…',         onClick: () => openSnoozeMenu(it, row) },
    ]);
  });
}
